<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Med Quiz: Colors</title>
    <style>
        :root {
            --accent: #ff8e73ff; /* Коралловый */
            --correct: #63db93ff; /* Мятный */
            --bg: #0a0a0a;
        }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        
        #grid { position: absolute; width: 100vw; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .zone { border: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: center; position: relative; transition: background 0.2s; cursor: pointer; }
        .zone:active { background: rgba(99, 219, 147, 0.1); }
        .zone-label { font-size: 22px; font-weight: bold; color: var(--correct); text-align: center; pointer-events: none; padding: 20px; line-height: 1.2; }

        #ui { position: absolute; top: 0; width: 100%; display: flex; justify-content: center; padding: 20px; z-index: 10; }
        #progress { font-size: 22px; color: var(--accent); font-weight: bold; }
        
        #question-card { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 260px; min-height: 120px; background: #161616; border: 3px solid var(--accent);
            display: flex; align-items: center; justify-content: center; text-align: center;
            padding: 25px; border-radius: 20px; font-weight: bold; font-size: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8); z-index: 5; pointer-events: none;
            transition: transform 0.1s, opacity 0.3s, border-color 0.2s;
        }

        #result-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); display: none; flex-direction: column; 
            align-items: center; padding: 30px; overflow-y: auto; z-index: 100; 
        }
        .error-item { background: #161616; margin: 10px 0; padding: 18px; border-left: 5px solid var(--accent); width: 100%; max-width: 550px; border-radius: 8px; }
        .error-q { color: var(--accent); font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; border-color: #ff4444 !important; }
        @keyframes shake {
            10%, 90% { transform: translate(-52%, -50%); }
            20%, 80% { transform: translate(-48%, -50%); }
            30%, 50%, 70% { transform: translate(-54%, -50%); }
            40%, 60% { transform: translate(-46%, -50%); }
        }
        button { margin: 30px; padding: 15px 40px; background: var(--correct); border: none; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; color: #000; }
    </style>
</head>
<body>

    <div id="ui"><div id="progress">Вопрос: 1/12</div></div>

    <div id="grid">
        <div class="zone" onclick="processChoice(0)"><div class="zone-label"></div></div>
        <div class="zone" onclick="processChoice(1)"><div class="zone-label"></div></div>
        <div class="zone" onclick="processChoice(2)"><div class="zone-label"></div></div>
        <div class="zone" onclick="processChoice(3)"><div class="zone-label"></div></div>
    </div>

    <div id="question-card">ЦЕНТР</div>

    <div id="result-screen">
        <h2 style="color: var(--correct)">Тест завершен!</h2>
        <div id="final-stats" style="font-size: 20px; margin-bottom: 20px;"></div>
        <h3 id="error-title">История ошибок:</h3>
        <div id="errors-list"></div>
        <button onclick="location.reload()">Начать заново</button>
    </div>

<script>
// Тот же массив вопросов (добавьте все 41 сюда)
const questionsMassive = [
    { q: "ЖДА", a: ["MCV ▼, RET ▼", "MCV ▼, RET ▲", "MCV ▲, RET ▼", "MCV N"], c: "MCV ▼, RET ▼" },
    { q: "B12", a: ["MCV ▼, RET ▼", "MCV ▼, RET ▲", "MCV ▲, RET ▼", "MCV N"], c: "MCV ▲, RET ▼" },
    { q: "АХЗ", a: ["ферр.▼, ОЖСС▲", "ферр.▲, ОЖСС▲", "ферр.▲, ОЖСС▼", "ферр.▼, ОЖСС▼"], c: "ферр.▲, ОЖСС▼" },
    { q: "Гемолиз", a: ["MCV ▼/N, RET ▲", "MCV ▲/N, RET ▲", "MCV ▲/N, RET ▼", "MCV ▼"], c: "MCV ▲/N, RET ▲" },
    { q: "СКА", a: ["Hb-патия", "мембранопатия", "ферментопатия", "инфекция"], c: "Hb-патия" },
    { q: "Микроцитоз", a: ["ЖДА, Pb", "В12", "В9", "Гемолиз"], c: "ЖДА, Pb" },
    { q: "B9", a: ["Гиперсегм. нейтр.", "Микроцитоз", "RET ▲", "Hb ▲"], c: "Гиперсегм. нейтр." },
    { q: "Причина #1 B12", a: ["ПА", "алиментарная", "мальабсорбция", "диета"], c: "ПА" },
    { q: "Неврология", a: ["В12", "В9", "ЖДА", "Pb"], c: "В12" },
    { q: "Гиперсегментация", a: ["B9", "ЖДА", "Pb", "АХЗ"], c: "B9" },
    { q: "RET ▲", a: ["Гемолиз", "ЖДА", "АХЗ", "В12"], c: "Гемолиз" },
    { q: "Микроцитоз", a: ["ЖДА, таласс.", "В12", "В9", "Гемолиз"], c: "ЖДА, таласс." }
];

let state = {
    lvl: 0,
    wrongLog: [], // Для отчета в конце
    currentBatch: [],
    animating: false,
    startX: 0, startY: 0
};

const card = document.getElementById('question-card');

function init() {
    state.currentBatch = questionsMassive.sort(() => Math.random() - 0.5).slice(0, 12);
    loadLevel();

    document.addEventListener('touchstart', e => {
        state.startX = e.touches[0].clientX;
        state.startY = e.touches[0].clientY;
    });

    document.addEventListener('touchend', e => {
        if (state.animating) return;
        const dx = e.changedTouches[0].clientX - state.startX;
        const dy = e.changedTouches[0].clientY - state.startY;
        if (Math.abs(dx) > 60 || Math.abs(dy) > 60) {
            const x = e.changedTouches[0].clientX;
            const y = e.changedTouches[0].clientY;
            processChoice(getZoneIndex(x, y));
        }
    });
}

function getZoneIndex(x, y) {
    const halfW = window.innerWidth / 2;
    const halfH = window.innerHeight / 2;
    if (x < halfW) return (y < halfH) ? 0 : 2;
    return (y < halfH) ? 1 : 3;
}

function loadLevel() {
    const qData = state.currentBatch[state.lvl];
    document.getElementById('progress').innerText = `Вопрос: ${state.lvl + 1}/12`;
    card.innerText = qData.q;
    card.style.opacity = '1';
    card.style.left = '50%'; card.style.top = '50%';
    card.style.transform = 'translate(-50%, -50%) scale(1)';

    const zones = document.querySelectorAll('.zone-label');
    const answers = [...qData.a].sort(() => Math.random() - 0.5);
    zones.forEach((z, i) => z.innerText = answers[i] || "");
}

function processChoice(idx) {
    if (state.animating) return;
    
    const zones = document.querySelectorAll('.zone-label');
    const chosen = zones[idx].innerText;
    const correct = state.currentBatch[state.lvl].c;

    if (chosen === correct) {
        state.animating = true;
        const zoneRect = zones[idx].parentElement.getBoundingClientRect();
        card.style.transition = "all 0.4s cubic-bezier(0.5, 0, 0.5, 1)";
        card.style.left = (zoneRect.left + zoneRect.width/2) + 'px';
        card.style.top = (zoneRect.top + zoneRect.height/2) + 'px';
        card.style.transform = "translate(-50%, -50%) scale(0.1)";
        card.style.opacity = "0";

        setTimeout(() => {
            state.lvl++;
            state.animating = false;
            card.style.transition = "none";
            if (state.lvl < 12) loadLevel();
            else showResults();
        }, 450);
    } else {
        // Ошибка: Тряска, но вопрос остается
        state.wrongLog.push({ q: state.currentBatch[state.lvl].q, c: correct, user: chosen });
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 400);
    }
}

init();

function showResults() {
    document.getElementById('result-screen').style.display = 'flex';
    document.getElementById('final-stats').innerText = `Ошибок допущено: ${state.wrongLog.length}`;
    const list = document.getElementById('errors-list');
    if (state.wrongLog.length === 0) {
        document.getElementById('error-title').innerText = "Безупречно!";
    } else {
        list.innerHTML = state.wrongLog.map(err => `
            <div class="error-item">
                <div class="error-q">${err.q}</div>
                <div style="font-size:15px; color:#aaa">Нужно было: <span style="color:var(--correct)">${err.c}</span></div>
            </div>
        `).join('');
    }
}
</script>
</body>
</html>
