<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mixing Knowledge Game</title>
    <style>
        body { background: #222; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        canvas { border: 4px solid #444; background: #000; cursor: pointer; margin-top: 20px; }
        .ui { margin-top: 10px; text-align: center; }
        .target { font-size: 24px; color: #0f0; font-weight: bold; }
    </style>
</head>
<body>

    <div class="ui">
        <div>Соберите слово: <span class="target" id="targetWord">REACTION</span></div>
        <div id="status">Соедините трубы правильно!</div>
    </div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const targetDisplay = document.getElementById('targetWord');

// Состояние игры
let segments = [
    { x: 100, y: 150, text: 'RE', angle: 0, type: 'start' },   // Левая труба
    { x: 300, y: 150, angle: 0, type: 'connector' },           // Центр (поворотный)
    { x: 500, y: 150, text: 'ACTION', angle: 0, type: 'end' }  // Правая труба
];

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    segments.forEach((s, index) => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle * Math.PI / 180);
        
        // Рисуем трубу
        ctx.strokeStyle = (s.angle === 0) ? '#0af' : '#555';
        ctx.lineWidth = 40;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-40, 0);
        ctx.lineTo(40, 0);
        ctx.stroke();

        // Текст на трубе
        if (s.text) {
            ctx.fillStyle = "white";
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.rotate(-s.angle * Math.PI / 180); // Держим текст ровно
            ctx.fillText(s.text, 0, 5);
        }
        ctx.restore();
    });

    checkConnection();
}

function checkConnection() {
    // Если все трубы в положении 0 градусов — они соединены
    const isConnected = segments.every(s => s.angle % 360 === 0);
    const status = document.getElementById('status');
    
    if (isConnected) {
        status.innerText = "✅ СЛОВО СОБРАНО! Энергия течет!";
        status.style.color = "#0f0";
    } else {
        status.innerText = "❌ Цепь разорвана...";
        status.style.color = "#f00";
    }
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    segments.forEach(s => {
        // Простая проверка клика по сегменту
        if (Math.hypot(mx - s.x, my - s.y) < 40) {
            s.angle = (s.angle + 90) % 360; // Поворот на 90 градусов
        }
    });
    draw();
});

draw();
</script>
</body>
</html>
