<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mixing Quiz: Pipeline</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        .header { text-align: center; margin-top: 20px; }
        canvas { border: 2px solid #555; background: #000; border-radius: 10px; cursor: pointer; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .score { font-size: 20px; color: #ffcc00; margin: 10px; }
        .task { font-size: 22px; margin-bottom: 10px; color: #00d4ff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="task" id="question">Задание: Соедините части слова</div>
        <div class="score">Счёт: <span id="scoreVal">0</span></div>
        <div id="status">Нажимайте на трубы, чтобы менять путь!</div>
    </div>
    <canvas id="gameCanvas" width="700" height="450"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// База вопросов
const quizData = [
    { prefix: "RE", right: "ACTION", wrong: "ING", task: "Процесс взаимодействия" },
    { prefix: "UN", right: "HAPPY", wrong: "NESS", task: "Антоним к слову Счастливый" },
    { prefix: "MICRO", right: "SCOPE", wrong: "PHONE", task: "Прибор для мелких объектов" },
    { prefix: "PRE", right: "VIEW", wrong: "SENT", task: "Предварительный просмотр" }
];

let currentIdx = 0;
let score = 0;

// Описание сегментов (x, y, тип)
// type: 0 - старт, 1 - угол, 2 - развилка, 3 - финиш
let segments = [
    { x: 100, y: 225, angle: 0, type: 'start' },
    { x: 250, y: 225, angle: 0, type: 'corner' },
    { x: 400, y: 225, angle: 0, type: 'corner' },
    { x: 550, y: 125, angle: 0, type: 'end_top' }, // Верхний выход (правильный)
    { x: 550, y: 325, angle: 0, type: 'end_bot' }  // Нижний выход (ложный)
];

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const q = quizData[currentIdx];
    document.getElementById('question').innerText = `Тема: ${q.task}`;

    segments.forEach(s => {
        ctx.save();
        ctx.translate(s.x, s.y);
        ctx.rotate(s.angle * Math.PI / 180);
        
        // Рисуем трубу
        ctx.strokeStyle = (s.angle === 0 || s.angle === 180) ? "#333" : "#00d4ff";
        if (s.type.includes('end')) ctx.strokeStyle = "#555";
        
        ctx.lineWidth = 30;
        ctx.beginPath();
        ctx.moveTo(-40, 0);
        ctx.lineTo(40, 0);
        ctx.stroke();

        // Текст на концах труб
        ctx.restore();
        ctx.fillStyle = "white";
        ctx.font = "14px bold Arial";
        if (s.type === 'start') ctx.fillText(q.prefix, s.x - 20, s.y - 30);
        if (s.type === 'end_top') {
            ctx.fillStyle = "#0f0";
            ctx.fillText(q.right, s.x - 20, s.y - 30);
        }
        if (s.type === 'end_bot') {
            ctx.fillStyle = "#f44";
            ctx.fillText(q.wrong, s.x - 20, s.y - 30);
        }
    });

    checkWin();
}

function checkWin() {
    // Упрощенная логика: если средние трубы повернуты "вверх", то идем к правильному ответу
    const mid1 = segments[1].angle;
    const mid2 = segments[2].angle;
    const status = document.getElementById('status');

    if (mid1 === 270 && mid2 === 270) {
        status.innerText = "✅ ВЕРНО! Поток идет к " + quizData[currentIdx].right;
        status.style.color = "#0f0";
        setTimeout(nextLevel, 1500);
    } else if (mid1 === 90 && mid2 === 90) {
        status.innerText = "❌ ОШИБКА! " + quizData[currentIdx].prefix + quizData[currentIdx].wrong + " — это не то.";
        status.style.color = "#f44";
    } else {
        status.innerText = "Соедините трубы к правильному ответу!";
        status.style.color = "white";
    }
}

function nextLevel() {
    score += 10;
    document.getElementById('scoreVal').innerText = score;
    currentIdx = (currentIdx + 1) % quizData.length;
    segments[1].angle = 0;
    segments[2].angle = 0;
    draw();
}

canvas.addEventListener('click', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left;
    const my = e.clientY - rect.top;

    segments.forEach(s => {
        if (Math.hypot(mx - s.x, my - s.y) < 50 && s.type === 'corner') {
            s.angle = (s.angle + 90) % 360;
        }
    });
    draw();
});

draw();
</script>
</body>
</html>
