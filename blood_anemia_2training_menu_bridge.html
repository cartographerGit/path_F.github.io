<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com"></script>
</head>
<body>
    <script>
        let round = 1, lives = 5;
        let correctIdx, pieces = [];

        function setup() {
            createCanvas(600, 400);
            nextRound();
        }

        function nextRound() {
            correctIdx = Math.floor(random(5));
            pieces = [];
            for (let i = 0; i < 5; i++) {
                pieces.push({ w: 40 + i * 10, h: 50 - i * 5, x: 50 + i * 100 });
            }
        }

        function draw() {
            background(51);
            fill(255);
            text(`Раунд: ${round}/10  Жизни: ${"❤️".repeat(lives)}`, 20, 30);
            
            // Рисуем варианты деталей
            for (let i = 0; i < pieces.length; i++) {
                fill(i === correctIdx ? '#add8e6' : '#87ceeb'); // Визуально они похожи
                rect(pieces[i].x, 300, pieces[i].w, pieces[i].h);
            }
        }

        function mousePressed() {
            for (let i = 0; i < pieces.length; i++) {
                if (mouseX > pieces[i].x && mouseX < pieces[i].x + pieces[i].w &&
                    mouseY > 300 && mouseY < 300 + pieces[i].h) {
                    if (i === correctIdx) {
                        round++;
                        nextRound();
                    } else {
                        lives--;
                        if (lives <= 0) alert("Game Over");
                    }
                }
            }
        }
    </script>
</body>
</html>
