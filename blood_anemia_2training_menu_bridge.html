<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pipeline Quiz Connect</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; }
        #ui { width: 600px; text-align: center; margin-top: 20px; }
        canvas { background: #000; border: 4px solid #333; border-radius: 10px; margin: 20px 0; }
        .controls { display: flex; justify-content: space-around; width: 100%; }
        button { 
            padding: 15px 25px; font-size: 18px; cursor: pointer; border: none; 
            border-radius: 5px; background: #00d4ff; color: #000; font-weight: bold;
            transition: 0.2s;
        }
        button:hover { background: #fff; transform: scale(1.05); }
        .timer-container { width: 100%; height: 10px; background: #333; border-radius: 5px; margin-bottom: 10px; }
        #timer-bar { width: 100%; height: 100%; background: #ff4444; }
        #question { font-size: 22px; height: 50px; color: #ffcc00; }
    </style>
</head>
<body>

    <div id="ui">
        <div id="question">Загрузка...</div>
        <div class="timer-container"><div id="timer-bar"></div></div>
        <canvas id="game" width="600" height="400"></canvas>
        <div class="controls">
            <button id="btn-up" onclick="handleAnswer('up')">Вариант А</button>
            <button id="btn-down" onclick="handleAnswer('down')">Вариант Б</button>
        </div>
    </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const quiz = [
    { q: "Земля круглая?", up: "Да (Верно)", down: "Нет (Ложь)", correct: "up" },
    { q: "2 + 2 = ?", up: "5", down: "4 (Верно)", correct: "down" },
    { q: "Столица РФ?", up: "Москва (Верно)", down: "Питер", correct: "up" },
    { q: "HTML это...", up: "Разметка (Верно)", down: "Стиль", correct: "up" },
    { q: "В байте сколько бит?", up: "10", down: "8 (Верно)", correct: "down" }
];

let currentLevel = 0;
let timeLeft = 15;
let isGameOver = false;
let pipeChain = []; // Массив отрисованных сегментов

// Инициализация
function init() {
    // Первый сегмент - всегда прямой, заполнен водой
    pipeChain.push({ x: 0, y: 200, type: 'straight', filled: true });
    updateUI();
    gameLoop();
}

function updateUI() {
    if (currentLevel < quiz.length) {
        const q = quiz[currentLevel];
        document.getElementById('question').innerText = q.q;
        document.getElementById('btn-up').innerText = q.up;
        document.getElementById('btn-down').innerText = q.down;
    } else {
        winGame();
    }
}

function handleAnswer(choice) {
    if (isGameOver) return;

    const q = quiz[currentLevel];
    const lastPipe = pipeChain[pipeChain.length - 1];

    if (choice === q.correct) {
        // Добавляем новый угловой сегмент, который соединяется с предыдущим
        // Направление изгиба зависит от ответа (для красоты рисуем "колено")
        const newPipe = {
            x: lastPipe.x + 80,
            y: lastPipe.y,
            type: 'angle',
            direction: choice, // 'up' или 'down'
            filled: true
        };
        
        pipeChain.push(newPipe);
        currentLevel++;
        timeLeft = 15; // Сброс таймера
        updateUI();
    } else {
        endGame("ОШИБКА! ТРУБА ТРЕСНУЛА!");
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    pipeChain.forEach((p, i) => {
        ctx.lineWidth = 30;
        ctx.lineJoin = "round";
        ctx.lineCap = "round";
        ctx.strokeStyle = p.filled ? "#00d4ff" : "#444";

        ctx.beginPath();
        if (p.type === 'straight') {
            // Прямая труба ---
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + 80, p.y);
        } else if (p.type === 'angle') {
            // Угловая труба L-образная
            // Соединяется с концом предыдущей (p.x, p.y)
            ctx.moveTo(p.x, p.y); 
            ctx.lineTo(p.x + 40, p.y); // Горизонтальный кусок
            if (p.direction === 'up') {
                ctx.lineTo(p.x + 40, p.y - 40); // Уходит вверх
            } else {
                ctx.lineTo(p.x + 40, p.y + 40); // Уходит вниз
            }
        }
        ctx.stroke();

        // Рисуем фланец (стык)
        ctx.fillStyle = "#666";
        ctx.fillRect(p.x - 5, p.y - 20, 10, 40);
    });
}

function gameLoop() {
    if (!isGameOver) {
        draw();
        timeLeft -= 0.02;
        document.getElementById('timer-bar').style.width = (timeLeft / 15 * 100) + "%";

        if (timeLeft <= 0) endGame("ДАВЛЕНИЕ ПРЕВЫШЕНО! ВЗРЫВ!");
        requestAnimationFrame(gameLoop);
    }
}

function endGame(msg) {
    isGameOver = true;
    document.getElementById('question').innerText = msg;
    document.getElementById('question').style.color = "#ff4444";
}

function winGame() {
    isGameOver = true;
    document.getElementById('question').innerText = "🏆 СИСТЕМА ПОСТРОЕНА! ПОБЕДА!";
    document.getElementById('question').style.color = "#00ff00";
}

init();
</script>
</body>
</html>
