<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Pressure Pipe Master</title>
    <style>
        body { background: #111; color: #eee; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        #stats { display: flex; justify-content: space-between; width: 800px; margin-top: 20px; font-size: 18px; }
        .lives { color: #ff4444; font-weight: bold; }
        #question-box { width: 800px; text-align: center; margin: 15px 0; min-height: 60px; }
        #question { font-size: 24px; color: #ffcc00; margin-bottom: 10px; }
        #timer-container { width: 800px; height: 8px; background: #333; border-radius: 4px; }
        #timer-bar { width: 100%; height: 100%; background: #00d4ff; transition: width 0.1s linear; }
        #game-container { position: relative; margin-top: 20px; }
        canvas { background: #050505; border: 2px solid #333; border-radius: 10px; }
        .btn-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ans-btn { 
            position: absolute; pointer-events: auto; padding: 10px 20px; 
            background: #222; border: 2px solid #444; color: #fff; 
            cursor: pointer; border-radius: 5px; font-weight: bold; transform: translate(-50%, -50%);
        }
        .ans-btn:hover { background: #444; border-color: #00d4ff; }
    </style>
</head>
<body>

    <div id="stats">
        <div>Уровень: <span id="lvl-num">1</span>/7</div>
        <div class="lives">Жизни: <span id="lives-count">7</span></div>
    </div>

    <div id="question-box">
        <div id="question">Подключение к системе...</div>
        <div id="timer-container"><div id="timer-bar"></div></div>
    </div>

    <div id="game-container">
        <canvas id="c" width="800" height="500"></canvas>
        <div id="buttons" class="btn-layer"></div>
    </div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const btnLayer = document.getElementById('buttons');

const quiz = [
    { q: "2 + 2 * 2 = ?", a1: "6", a2: "8", corr: "a1", type: "v" },
    { q: "Столица Японии?", a1: "Киото", a2: "Токио", corr: "a2", type: "h" },
    { q: "Процессор - это...", a1: "Мозг", a2: "Память", corr: "a1", type: "v" },
    { q: "JS расшифровывается как?", a1: "J-Script", a2: "JavaScript", corr: "a2", type: "h" },
    { q: "Корень из 81?", a1: "9", a2: "7", corr: "a1", type: "v" },
    { q: "Цвет чистого неба?", a1: "Синий", a2: "Зеленый", corr: "a1", type: "h" },
    { q: "1000м в 1км?", a1: "Да", a2: "Нет", corr: "a1", type: "v" }
];

let state = {
    lvl: 0,
    lives: 7,
    time: 15,
    isOver: false,
    pipes: [] // {x1, y1, x2, y2, xm, ym, filled, targetDir}
};

function init() {
    // Начальный залитый сегмент
    state.pipes.push({ x1: 20, y1: 250, x2: 100, y2: 250, filled: true });
    nextStep();
    requestAnimationFrame(loop);
}

function nextStep() {
    if (state.lvl >= quiz.length) {
        state.isOver = true;
        document.getElementById('question').innerText = "🏆 ПОБЕДА! ДАВЛЕНИЕ В НОРМЕ!";
        return;
    }

    const q = quiz[state.lvl];
    const last = state.pipes[state.pipes.length - 1];
    
    // Создаем "пустой" сегмент (предпросмотр) в рандомном положении
    const isUp = Math.random() > 0.5;
    const isLeft = Math.random() > 0.5;

    let nextP;
    if (q.type === 'v') {
        nextP = { x1: last.x2, y1: last.y2, xm: last.x2 + 40, ym: last.y2, x2: last.x2 + 40, y2: isUp ? last.y2 - 80 : last.y2 + 80, filled: false, currentDir: isUp ? 'a1' : 'a2' };
    } else {
        nextP = { x1: last.x2, y1: last.y2, xm: last.x2, ym: last.y2 - 40, x2: isLeft ? last.x2 - 80 : last.x2 + 80, y2: last.y2 - 40, filled: false, currentDir: isLeft ? 'a1' : 'a2' };
    }
    
    state.pipes.push(nextP);
    state.time = 15;
    renderUI(q, nextP);
}

function renderUI(q, p) {
    document.getElementById('question').innerText = q.q;
    document.getElementById('lvl-num').innerText = state.lvl + 1;
    btnLayer.innerHTML = '';

    // Размещаем кнопки у концов трубы
    const b1 = createBtn(q.a1, 'a1', p);
    const b2 = createBtn(q.a2, 'a2', p);
    btnLayer.appendChild(b1);
    btnLayer.appendChild(b2);
}

function createBtn(text, id, p) {
    const b = document.createElement('button');
    b.className = 'ans-btn';
    b.innerText = text;
    
    if (quiz[state.lvl].type === 'v') {
        b.style.left = (p.x2 + 60) + 'px';
        b.style.top = (id === 'a1' ? p.y1 - 60 : p.y1 + 100) + 'px';
    } else {
        b.style.top = (p.y2 - 60) + 'px';
        b.style.left = (id === 'a1' ? p.x1 - 40 : p.x1 + 120) + 'px';
    }

    b.onclick = () => check(id);
    return b;
}

function check(choice) {
    const q = quiz[state.lvl];
    const currentPipe = state.pipes[state.pipes.length - 1];

    if (choice === q.corr) {
        // Поворачиваем трубу к правильному ответу и заливаем
        if (choice !== currentPipe.currentDir) {
            currentPipe.y2 = currentPipe.y1 + (currentPipe.y1 - currentPipe.y2); // flip vertical
            currentPipe.x2 = currentPipe.x1 + (currentPipe.x1 - currentPipe.x2); // flip horizontal
        }
        currentPipe.filled = true;
        state.lvl++;
        nextStep();
    } else {
        state.lives--;
        document.getElementById('lives-count').innerText = state.lives;
        if (state.lives <= 0) die("СИСТЕМА РАЗРУШЕНА!");
    }
}

function die(msg) {
    state.isOver = true;
    document.getElementById('question').innerText = msg;
    document.getElementById('question').style.color = "#ff4444";
    btnLayer.innerHTML = '';
}

function loop() {
    if (state.isOver) return;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    state.pipes.forEach(p => {
        ctx.beginPath();
        ctx.lineWidth = 20;
        ctx.lineJoin = "round";
        ctx.strokeStyle = p.filled ? "#00d4ff" : "#333";
        ctx.moveTo(p.x1, p.y1);
        if (p.xm) ctx.lineTo(p.xm, p.ym);
        ctx.lineTo(p.x2, p.y2);
        ctx.stroke();
        
        // Стык
        ctx.fillStyle = "#555";
        ctx.fillRect(p.x2 - 4, p.y2 - 10, 8, 20);
    });

    state.time -= 0.016;
    document.getElementById('timer-bar').style.width = (state.time / 15 * 100) + "%";
    if (state.time <= 0) {
        state.lives--;
        document.getElementById('lives-count').innerText = state.lives;
        if (state.lives <= 0) die("ВРЕМЯ ВЫШЛО!");
        else state.time = 15;
    }

    requestAnimationFrame(loop);
}

init();
</script>
</body>
</html>
