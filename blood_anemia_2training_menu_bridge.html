<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Magnetic Quiz Sorting</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; }
        #game-wrapper { position: relative; width: 800px; height: 600px; margin-top: 20px; border: 2px solid #333; background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        canvas { display: block; }
        
        /* Стили магнитных зон */
        .magnet { position: absolute; padding: 15px; border: 2px solid #444; border-radius: 8px; font-weight: bold; text-transform: uppercase; color: #00d4ff; background: rgba(0, 212, 255, 0.1); width: 120px; text-align: center; }
        .top { top: 10px; left: 50%; transform: translateX(-50%); }
        .bottom { bottom: 10px; left: 50%; transform: translateX(-50%); }
        .left { left: 10px; top: 50%; transform: translateY(-50%); }
        .right { right: 10px; top: 50%; transform: translateY(-50%); }

        #ui { position: absolute; width: 100%; top: -40px; display: flex; justify-content: space-between; font-size: 18px; }
        .lives { color: #ff4444; }
        #center-question { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; color: #ffcc00; font-weight: bold; text-shadow: 0 0 15px rgba(255, 204, 0, 0.5); text-align: center; width: 250px; }
    </style>
</head>
<body>

    <div id="game-wrapper">
        <div id="ui">
            <div>Очки: <span id="score">0</span></div>
            <div class="lives">Жизни: <span id="lives">5</span></div>
        </div>

        <!-- Магнитные полюса (Ответы) -->
        <div id="m-up" class="magnet top">Вариант 1</div>
        <div id="m-down" class="magnet bottom">Вариант 2</div>
        <div id="m-left" class="magnet left">Вариант 3</div>
        <div id="m-right" class="magnet right">Вариант 4</div>

        <canvas id="c" width="800" height="600"></canvas>
        <div id="center-question">Загрузка...</div>
    </div>

    <p style="color: #666;">Используйте стрелки на клавиатуре: ↑ ↓ ← →</p>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const qDisplay = document.getElementById('center-question');

// База вопросов: объект в центре и 4 категории по краям
const quizData = [
    { q: "ЯБЛОКО", up: "Птица", down: "Металл", left: "Фрукт", right: "Машина", correct: "left" },
    { q: "ЖЕЛЕЗО", up: "Металл", down: "Газ", left: "Жидкость", right: "Ткань", correct: "up" },
    { q: "ОРЕЛ", up: "Рыба", down: "Птица", left: "Насекомое", right: "Зверь", correct: "down" },
    { q: "МЕРСЕДЕС", up: "Город", down: "Еда", left: "Мебель", right: "Машина", correct: "right" },
    { q: "ВОДОРОД", up: "Газ", down: "Твердое", left: "Дерево", right: "Планета", correct: "up" }
];

let state = {
    current: 0,
    lives: 5,
    score: 0,
    animX: 400,
    animY: 300,
    isMoving: false,
    targetDir: null,
    gameOver: false
};

function init() {
    updateQuestion();
    window.addEventListener('keydown', handleKey);
    requestAnimationFrame(gameLoop);
}

function updateQuestion() {
    if (state.current >= quizData.length) {
        finishGame("ПОБЕДА!");
        return;
    }
    const data = quizData[state.current];
    qDisplay.innerText = data.q;
    qDisplay.style.opacity = 1;
    state.animX = 400;
    state.animY = 300;
    state.isMoving = false;

    // Обновляем текст на магнитах
    document.getElementById('m-up').innerText = data.up;
    document.getElementById('m-down').innerText = data.down;
    document.getElementById('m-left').innerText = data.left;
    document.getElementById('m-right').innerText = data.right;
}

function handleKey(e) {
    if (state.isMoving || state.gameOver) return;

    let dir = "";
    if (e.key === "ArrowUp") dir = "up";
    if (e.key === "ArrowDown") dir = "down";
    if (e.key === "ArrowLeft") dir = "left";
    if (e.key === "ArrowRight") dir = "right";

    if (dir) {
        state.targetDir = dir;
        state.isMoving = true;
        checkAnswer(dir);
    }
}

function checkAnswer(dir) {
    const correct = quizData[state.current].correct;
    
    if (dir === correct) {
        state.score += 10;
        document.getElementById('score').innerText = state.score;
        // Эффект успеха: текст улетает и меняется
        setTimeout(() => {
            state.current++;
            updateQuestion();
        }, 500);
    } else {
        state.lives--;
        document.getElementById('lives').innerText = state.lives;
        if (state.lives <= 0) {
            finishGame("ИГРА ОКОНЧЕНА");
        } else {
            // Тряска и сброс позиции
            state.isMoving = false;
            state.animX = 400;
            state.animY = 300;
        }
    }
}

function gameLoop() {
    if (state.gameOver) return;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Рисуем силовые линии (визуальный эффект магнита)
    ctx.strokeStyle = "rgba(0, 212, 255, 0.1)";
    ctx.lineWidth = 1;
    for(let i=0; i<8; i++) {
        ctx.beginPath();
        ctx.arc(400, 300, 50 + i*30, 0, Math.PI*2);
        ctx.stroke();
    }

    if (state.isMoving) {
        const speed = 15;
        if (state.targetDir === "up") state.animY -= speed;
        if (state.targetDir === "down") state.animY += speed;
        if (state.targetDir === "left") state.animX -= speed;
        if (state.targetDir === "right") state.animX += speed;
        
        qDisplay.style.left = state.animX + "px";
        qDisplay.style.top = state.animY + "px";
        qDisplay.style.opacity = 0.5;
    }

    requestAnimationFrame(gameLoop);
}

function finishGame(msg) {
    state.gameOver = true;
    qDisplay.innerText = msg;
    qDisplay.style.color = (state.lives > 0) ? "#0f0" : "#f00";
    qDisplay.style.left = "50%";
    qDisplay.style.top = "50%";
}

init();
</script>
</body>
</html>
