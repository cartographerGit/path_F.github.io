<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magnetic Swipe Quiz</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; overflow: hidden; touch-action: none; }
        #game-ui { width: 100%; max-width: 600px; display: flex; justify-content: space-between; padding: 15px; box-sizing: border-box; font-size: 20px; z-index: 10; }
        #hearts { color: #ff4444; letter-spacing: 3px; }
        #timer-container { width: 100%; height: 6px; background: #222; position: absolute; top: 60px; }
        #timer-bar { width: 100%; height: 100%; background: #00d4ff; transition: width 0.1s linear; }

        #arena { position: relative; width: 100vw; height: 80vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        
        .magnet { position: absolute; padding: 12px; border: 2px solid #333; border-radius: 10px; background: rgba(0,212,255,0.05); color: #00d4ff; font-weight: bold; width: 100px; text-align: center; font-size: 14px; text-transform: uppercase; }
        .top { top: 20px; border-color: #00d4ff; }
        .bottom { bottom: 20px; border-color: #00d4ff; }
        .left { left: 10px; border-color: #00d4ff; }
        .right { right: 10px; border-color: #00d4ff; }

        #question { position: absolute; font-size: 32px; font-weight: 900; color: #ffcc00; text-align: center; pointer-events: none; transition: transform 0.1s ease-out; text-shadow: 0 0 20px rgba(255,204,0,0.4); }
        .hint { position: fixed; bottom: 20px; color: #444; font-size: 12px; }
    </style>
</head>
<body>

    <div id="game-ui">
        <div id="hearts">❤️❤️❤️❤️❤️</div>
        <div>Этап: <span id="round">1</span>/10</div>
    </div>
    <div id="timer-container"><div id="timer-bar"></div></div>

    <div id="arena">
        <div id="m-up" class="magnet top">ВВЕРХ</div>
        <div id="m-down" class="magnet bottom">ВНИЗ</div>
        <div id="m-left" class="magnet left">ЛЕВО</div>
        <div id="m-right" class="magnet right">ПРАВО</div>
        <div id="question">ЦЕНТР</div>
    </div>

    <div class="hint">ПК: Стрелки | Телефон: Свайп</div>

<script>
const quiz = [
    { q: "КИТ", up: "Лес", down: "Океан", left: "Космос", right: "Пустыня", ok: "down" },
    { q: "МАРС", up: "Еда", down: "Город", left: "Планета", right: "Цветок", ok: "left" },
    { q: "БОРЩ", up: "Одежда", down: "Суп", left: "Мебель", right: "Инструмент", ok: "down" },
    { q: "ДУБ", up: "Дерево", down: "Рыба", left: "Птица", right: "Металл", ok: "up" },
    { q: "МОЛОТОК", up: "Ткань", down: "Посуда", left: "Овощ", right: "Инструмент", ok: "right" },
    { q: "6 + 6", up: "10", down: "12", left: "14", right: "16", ok: "down" },
    { q: "JS", up: "Скрипт", down: "Стиль", left: "Железо", right: "Книга", ok: "up" },
    { q: "ТОКИО", up: "Китай", down: "Корея", left: "Япония", right: "США", ok: "left" },
    { q: "ЗОЛОТО", up: "Газ", down: "Дерево", left: "Металл", right: "Вода", ok: "left" },
    { q: "ФИНАЛ", up: "Конец", down: "Старт", left: "Пауза", right: "Цикл", ok: "up" }
];

let state = {
    lvl: 0, lives: 5, time: 10, speed: 8, 
    isMoving: false, over: false,
    touchX: 0, touchY: 0
};

const qDiv = document.getElementById('question');

function init() {
    updateView();
    window.addEventListener('keydown', e => move(e.key.replace('Arrow','').toLowerCase()));
    
    // Swipe Logic
    document.addEventListener('touchstart', e => {
        state.touchX = e.touches[0].clientX;
        state.touchY = e.touches[0].clientY;
    });
    document.addEventListener('touchend', e => {
        const dx = e.changedTouches[0].clientX - state.touchX;
        const dy = e.changedTouches[0].clientY - state.touchY;
        if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? 'right' : 'left');
        else move(dy > 0 ? 'down' : 'up');
    });

    setInterval(tick, 100);
}

function updateView() {
    if (state.lvl >= 10) return win();
    const data = quiz[state.lvl];
    qDiv.innerText = data.q;
    qDiv.style.transform = `translate(0, 0)`;
    document.getElementById('m-up').innerText = data.up;
    document.getElementById('m-down').innerText = data.down;
    document.getElementById('m-left').innerText = data.left;
    document.getElementById('m-right').innerText = data.right;
    document.getElementById('round').innerText = state.lvl + 1;
    state.isMoving = false;
    state.time = 10;
}

function move(dir) {
    if (state.isMoving || state.over || !['up','down','left','right'].includes(dir)) return;
    state.isMoving = true;
    
    // Анимация улета
    const offset = 600;
    const x = dir === 'left' ? -offset : (dir === 'right' ? offset : 0);
    const y = dir === 'up' ? -offset : (dir === 'down' ? offset : 0);
    qDiv.style.transition = `transform ${0.5 - (state.lvl*0.03)}s ease-in`;
    qDiv.style.transform = `translate(${x}px, ${y}px)`;

    setTimeout(() => check(dir), 300);
}

function check(dir) {
    if (dir === quiz[state.lvl].ok) {
        state.lvl++;
        state.speed += 1; // Ускорение (логическое)
        updateView();
    } else {
        fail();
    }
}

function fail() {
    state.lives--;
    updateHearts();
    if (state.lives <= 0) return lose();
    qDiv.style.transition = 'none';
    updateView();
}

function updateHearts() {
    document.getElementById('hearts').innerText = "❤️".repeat(state.lives);
}

function tick() {
    if (state.over || state.isMoving) return;
    state.time -= 0.1;
    document.getElementById('timer-bar').style.width = (state.time * 10) + "%";
    if (state.time <= 0) fail();
}

function win() { state.over = true; qDiv.innerText = "🏆 ПОБЕДА!"; qDiv.style.color = "#0f0"; }
function lose() { state.over = true; qDiv.innerText = "💀 GAME OVER"; qDiv.style.color = "#f00"; }

init();
</script>
</body>
</html>
