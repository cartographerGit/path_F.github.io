<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medical Zones Quiz</title>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow: hidden; touch-action: none; }
        
        /* Сетка на 4 зоны */
        #grid { position: absolute; width: 100vw; height: 100vh; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
        .zone { border: 1px solid #1a1a1a; display: flex; align-items: center; justify-content: center; position: relative; transition: background 0.2s; cursor: pointer; }
        .zone:active { background: rgba(0, 212, 255, 0.1); }
        .zone-label { font-size: clamp(14px, 4vw, 18px); font-weight: bold; color: #00d4ff; text-align: center; pointer-events: none; padding: 15px; }

        /* Интерфейс */
        #ui { position: absolute; top: 0; width: 100%; display: flex; justify-content: center; padding: 15px; box-sizing: border-box; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        #progress { font-size: 20px; color: #aaa; }
        
        /* Карточка вопроса */
        #question-card { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 220px; min-height: 100px; background: #1a1a1a; border: 2px solid #ffcc00;
            display: flex; align-items: center; justify-content: center; text-align: center;
            padding: 20px; border-radius: 15px; font-weight: bold; font-size: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9); z-index: 5; pointer-events: none;
            transition: transform 0.1s, opacity 0.3s;
        }

        /* Экран результатов */
        #result-screen { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #0a0a0a; display: none; flex-direction: column; 
            align-items: center; padding: 20px; overflow-y: auto; z-index: 100; 
        }
        .error-item { background: #161616; margin: 8px 0; padding: 15px; border-left: 4px solid #f44; width: 100%; max-width: 500px; border-radius: 4px; }
        .error-q { color: #ffcc00; font-weight: bold; margin-bottom: 5px; }
        .stats-main { font-size: 24px; margin: 20px 0; color: #0f0; }
        
        /* Анимации */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate(-52%, -50%); }
            20%, 80% { transform: translate(-48%, -50%); }
            30%, 50%, 70% { transform: translate(-53%, -50%); border-color: #f44; }
            40%, 60% { transform: translate(-47%, -50%); }
        }
    </style>
</head>
<body>

    <div id="ui"><div id="progress">Вопрос: 1/12</div></div>

    <div id="grid">
        <div class="zone" id="z0" onclick="processChoice(0)"><div class="zone-label"></div></div>
        <div class="zone" id="z1" onclick="processChoice(1)"><div class="zone-label"></div></div>
        <div class="zone" id="z2" onclick="processChoice(2)"><div class="zone-label"></div></div>
        <div class="zone" id="z3" onclick="processChoice(3)"><div class="zone-label"></div></div>
    </div>

    <div id="question-card">ЦЕНТР</div>

    <div id="result-screen">
        <div class="stats-main">Тест завершен!</div>
        <div id="final-score" style="margin-bottom: 20px;"></div>
        <h3 id="error-title">Ваши ошибки:</h3>
        <div id="errors-list"></div>
        <button onclick="location.reload()" style="margin: 30px; padding: 12px 30px; background: #00d4ff; border: none; border-radius: 5px; font-weight: bold; cursor: pointer;">Повторить</button>
    </div>

<script>
const questionsMassive = [
    { q: "ЖДА", a: ["MCV ▼, RET ▼", "MCV ▼, RET ▲", "MCV ▲, RET ▼", "MCV N"], c: "MCV ▼, RET ▼" },
    { q: "отравл. Pb", a: ["MCV ▼, RET ▼", "MCV ▼, RET ▲", "MCV ▲, RET ▼", "MCV N"], c: "MCV ▼, RET ▼" },
    { q: "B12", a: ["MCV ▼, RET ▼", "MCV ▼, RET ▲", "MCV ▲, RET ▼", "MCV N"], c: "MCV ▲, RET ▼" },
    { q: "B9", a: ["MCV ▼, RET ▼", "MCV ▼, RET ▲", "MCV ▲, RET ▼", "MCV N"], c: "MCV ▲, RET ▼" },
    { q: "Гемолиз", a: ["MCV ▼/N, RET ▲", "MCV ▲/N, RET ▲", "MCV ▲/N, RET ▼", "MCV ▼"], c: "MCV ▲/N, RET ▲" },
    { q: "Синдромы В12", a: ["сидеропенич.", "инфекции", "неврологич.", "геморрагич."], c: "неврологич." },
    { q: "ЖДА (показатели)", a: ["ферр.▼, ОЖСС▲", "ферр.▲, ОЖСС▲", "ферр.▼, ОЖСС▼", "ферр.▲, ОЖСС▼"], c: "ферр.▼, ОЖСС▲" },
    { q: "АХЗ (показатели)", a: ["ферр.▼, ОЖСС▲", "ферр.▲, ОЖСС▲", "ферр.▲, ОЖСС▼", "ферр.▼, ОЖСС▼"], c: "ферр.▲, ОЖСС▼" },
    { q: "Причина #1 B12", a: ["ПА", "алиментарная", "мальабсорбция", "кровопотеря"], c: "ПА" },
    { q: "ЖДА (рецепторы)", a: ["sTfR▼, ОЖСС▲", "sTfR▲, ОЖСС▲", "sTfR▼, ОЖСС▼", "sTfR▲, ОЖСС▼"], c: "sTfR▲, ОЖСС▲" },
    { q: "Микроцитоз", a: ["ЖДА, Pb", "В12", "В9", "Гемолиз"], c: "ЖДА, Pb" },
    { q: "Макроцитоз", a: ["В12, Фанкони", "ЖДА", "Pb", "Талассемия"], c: "В12, Фанкони" },
    { q: "RET ▲", a: ["Гемолиз", "ЖДА", "АХЗ", "В12"], c: "Гемолиз" },
    { q: "СКА", a: ["Hb-патия", "мембранопатия", "ферментопатия", "инфекция"], c: "Hb-патия" },
    { q: "бол. Минковского-Шоффара", a: ["Hb-патия", "мембранопатия", "ферментопатия", "вирус"], c: "мембранопатия" },
    { q: "Гиперсегментация нейтрофилов", a: ["B9", "ЖДА", "отравл. Pb", "АХЗ"], c: "B9" }
    // ... можно добавить остальные ваши вопросы здесь
];

let state = {
    lvl: 0,
    wrongAnswers: [],
    currentBatch: [],
    startX: 0, startY: 0,
    animating: false
};

const card = document.getElementById('question-card');

function init() {
    // Выбираем 12 случайных вопросов
    state.currentBatch = questionsMassive.sort(() => Math.random() - 0.5).slice(0, 12);
    loadLevel();

    // Swipe для мобильных
    document.addEventListener('touchstart', e => {
        state.startX = e.touches.clientX;
        state.startY = e.touches.clientY;
    });

    document.addEventListener('touchend', e => {
        if (state.animating) return;
        const dx = e.changedTouches.clientX - state.startX;
        const dy = e.changedTouches.clientY - state.startY;
        
        if (Math.abs(dx) > 60 || Math.abs(dy) > 60) {
            const x = e.changedTouches.clientX;
            const y = e.changedTouches.clientY;
            processChoice(getZoneIndex(x, y));
        }
    });
}

function getZoneIndex(x, y) {
    const halfW = window.innerWidth / 2;
    const halfH = window.innerHeight / 2;
    if (x < halfW) return (y < halfH) ? 0 : 2;
    return (y < halfH) ? 1 : 3;
}

function loadLevel() {
    const qData = state.currentBatch[state.lvl];
    document.getElementById('progress').innerText = `Вопрос: ${state.lvl + 1}/12`;
    card.innerText = qData.q;
    card.style.opacity = '1';
    card.style.transform = 'translate(-50%, -50%) scale(1)';

    // Рандомизируем ответы по зонам
    const answers = [...qData.a].sort(() => Math.random() - 0.5);
    for(let i=0; i<4; i++) {
        document.getElementById(`z${i}`).querySelector('.zone-label').innerText = answers[i] || "";
    }
}

function processChoice(idx) {
    if (state.animating) return;
    state.animating = true;

    const chosen = document.getElementById(`z${idx}`).querySelector('.zone-label').innerText;
    const correct = state.currentBatch[state.lvl].c;

    if (chosen === correct) {
        // Улет в зону
        const zone = document.getElementById(`z${idx}`).getBoundingClientRect();
        card.style.transition = "all 0.4s cubic-bezier(0.5, 0, 0.5, 1)";
        card.style.left = (zone.left + zone.width/2) + 'px';
        card.style.top = (zone.top + zone.height/2) + 'px';
        card.style.transform = "translate(-50%, -50%) scale(0.2)";
        card.style.opacity = "0";

        setTimeout(next, 450);
    } else {
        // Анимация ошибки (тряска)
        state.wrongAnswers.push({ q: state.currentBatch[state.lvl].q, c: correct, user: chosen });
        card.classList.add('shake');
        setTimeout(() => {
            card.classList.remove('shake');
            next();
        }, 500);
    }
}

function next() {
    card.style.transition = "none";
    card.style.left = "50%";
    card.style.top = "50%";
    state.lvl++;
    state.animating = false;
    
    if (state.lvl < 12) loadLevel();
    else showResults();
}

function showResults() {
    document.getElementById('result-screen').style.display = 'flex';
    const score = 12 - state.wrongAnswers.length;
    document.getElementById('final-score').innerText = `Ваш результат: ${score} из 12`;
    
    const list = document.getElementById('errors-list');
    if (state.wrongAnswers.length === 0) {
        document.getElementById('error-title').innerText = "Идеально! Ошибок нет.";
    } else {
        list.innerHTML = state.wrongAnswers.map(err => `
            <div class="error-item">
                <div class="error-q">${err.q}</div>
                <div style="font-size:14px; color:#aaa">Вы ответили: <span style="color:#f44">${err.user}</span></div>
                <div style="font-size:14px; color:#aaa">Правильно: <span style="color:#0f0">${err.c}</span></div>
            </div>
        `).join('');
    }
}

init();
</script>
</body>
</html>
