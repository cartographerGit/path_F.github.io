<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Bridge Builder Game</title>
    <style>
        body { background: #222; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        canvas { background: #333; border: 4px solid #555; cursor: pointer; margin-top: 20px; }
        .info { margin-top: 20px; font-size: 20px; }
    </style>
</head>
<body>
    <div class="info" id="stats">Загрузка...</div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const stats = document.getElementById('stats');

        let round = 1;
        let lives = 5;
        let gameOver = false;
        let correctIdx = 0;
        let pieces = [];
        let bridge = [];
        let shake = 0;

        function initRound() {
            if (round > 10 || lives <= 0) {
                gameOver = true;
                return;
            }
            correctIdx = Math.floor(Math.random() * 5);
            pieces = [];
            for (let i = 0; i < 5; i++) {
                // Разные формы деталей
                pieces.push({
                    w: 40 + (i * 15),
                    h: 30 + (Math.sin(i) * 20 + 20),
                    x: 50 + (i * 150)
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Обновление статистики
            stats.innerText = `Раунд: ${round}/10 | Жизни: ${"❤️".repeat(lives)}`;

            if (gameOver) {
                ctx.fillStyle = "white";
                ctx.font = "40px Arial";
                ctx.textAlign = "center";
                ctx.fillText(lives > 0 ? "ПОБЕДА! 🎉" : "ИГРА ОКОНЧЕНА 💀", 400, 200);
                return;
            }

            // Рисуем цель (чертеж)
            ctx.strokeStyle = "#aaa";
            ctx.setLineDash([5, 5]);
            ctx.strokeRect(370, 50, 60, 60);
            ctx.setLineDash([]);
            
            ctx.fillStyle = "#4CAF50";
            const target = pieces[correctIdx];
            ctx.fillRect(400 - target.w/2, 80 - target.h/2, target.w, target.h);
            ctx.fillStyle = "white";
            ctx.font = "14px Arial";
            ctx.fillText("НУЖНА ЭТА ФОРМА", 400, 40);

            // Рисуем мост
            ctx.fillStyle = "gold";
            bridge.forEach((b, i) => {
                ctx.fillRect(20 + (i * 55), 180, 50, 15);
            });

            // Рисуем варианты выбора
            let offsetX = Math.sin(Date.now() * 0.1) * shake;
            pieces.forEach((p, i) => {
                ctx.fillStyle = (shake > 0) ? "red" : "#3498db";
                ctx.fillRect(p.x + (shake > 0 ? offsetX : 0), 300, p.w, p.h);
                ctx.fillStyle = "white";
                ctx.fillText(`Вариант ${i+1}`, p.x + p.w/2 - 25, 290);
            });

            if (shake > 0) shake *= 0.9; // Затухание тряски
            requestAnimationFrame(draw);
        }

        canvas.addEventListener('click', (e) => {
            if (gameOver) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            pieces.forEach((p, i) => {
                if (mx > p.x && mx < p.x + p.w && my > 300 && my < 300 + p.h) {
                    if (i === correctIdx) {
                        bridge.push(true);
                        round++;
                        initRound();
                    } else {
                        lives--;
                        shake = 10;
                        if (lives <= 0) gameOver = true;
                    }
                }
            });
        });

        initRound();
        draw();
    </script>
</body>
</html>
