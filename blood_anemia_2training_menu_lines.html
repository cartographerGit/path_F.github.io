<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Med Matcher HTML</title>
    <style>
        :root {
            --accent: #ff8e73ff; /* Коралловый */
            --correct: #63db93ff; /* Мятный */
            --bg: #0a0a0a;
        }
        body { 
            background: var(--bg); color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 20px; box-sizing: border-box;
        }
        h2 { color: var(--accent); margin-bottom: 20px; text-align: center; }
        
        .game-container {
            display: flex; justify-content: space-between;
            width: 100%; max-width: 900px; position: relative; margin-top: 20px;
        }
        
        .column { display: flex; flex-direction: column; gap: 20px; width: 42%; z-index: 2; }
        
        .card {
            background: #161616; border: 2px solid #333;
            padding: 15px; border-radius: 12px; text-align: center;
            font-weight: bold; cursor: pointer; transition: 0.2s;
            font-size: 20px; /* Увеличенный шрифт */
            min-height: 70px; display: flex; align-items: center; justify-content: center;
            line-height: 1.3;
        }
        .card:hover { border-color: var(--accent); }
        .card.selected { border-color: var(--accent); background: rgba(255, 142, 115, 0.15); transform: scale(1.03); }
        .card.matched { border-color: var(--correct); color: var(--correct); cursor: default; opacity: 0.7; }
        
        svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        line { stroke: var(--correct); stroke-width: 5; stroke-linecap: round; opacity: 0.8; }

        .shake { animation: shake 0.4s; border-color: #ff4444 !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }

        #win-msg { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #161616; padding: 40px; border: 3px solid var(--correct);
            border-radius: 20px; text-align: center; z-index: 100; box-shadow: 0 0 50px rgba(0,0,0,0.9);
        }
    </style>
</head>
<body>

    <h2>Соедините пары <br> (6 случайных)</h2>
    
    <div class="game-container" id="game">
        <svg id="svg-canvas"></svg>
        <div class="column" id="left-col"></div>
        <div class="column" id="right-col"></div>
    </div>

    <div id="win-msg">
        <h1 style="color: var(--correct)">ГОТОВО!</h1>
        <p>Все связи установлены.</p>
        <button onclick="location.reload()" style="background: var(--correct); border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px;">Ещё раз</button>
    </div>

<script>
// Данные с использованием <br>
const pairsPool = [
    { l: "ЖДА<br>(диагноз)", r: "ферр.▼<br>ОЖСС▲" },
    { l: "АХЗ<br>(диагноз)", r: "ферр.▲<br>ОЖСС▼" },
    { l: "B12<br>дефицит", r: "неврологич.<br>синдром" },
    { l: "B9<br>дефицит", r: "гиперсегм.<br>нейтрофилы" },
    { l: "Гемолиз<br>(RET)", r: "RET ▲▲▲<br>(криз)" },
    { l: "Свинец<br>(Pb)", r: "MCV ▼<br>RET ▼" },
    { l: "СКА<br>(тип)", r: "наследств.<br>Hb-патия" },
    { l: "Микроцитоз<br>(MCV)", r: "MCV ▼<br>(малый объем)" },
    { l: "Макроцитоз<br>(MCV)", r: "MCV ▲<br>(большой объем)" },
    { l: "Ферритин<br>(белок)", r: "депо<br>железа" }
];

let selectedLeft = null;
let matchedCount = 0;

function init() {
    const currentPairs = [...pairsPool].sort(() => Math.random() - 0.5).slice(0, 6);
    
    const leftCol = document.getElementById('left-col');
    const rightCol = document.getElementById('right-col');

    const leftItems = currentPairs.map(p => ({text: p.l, id: p.l})).sort(() => Math.random() - 0.5);
    const rightItems = currentPairs.map(p => ({text: p.r, id: p.l})).sort(() => Math.random() - 0.5);

    leftItems.forEach(item => leftCol.appendChild(createCard(item.text, item.id, 'left')));
    rightItems.forEach(item => rightCol.appendChild(createCard(item.text, item.id, 'right')));
}

function createCard(text, id, side) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = text; // Используем innerHTML для поддержки <br>
    div.dataset.id = id;
    div.dataset.side = side;
    div.onclick = () => handleSelect(div);
    return div;
}

function handleSelect(card) {
    if (card.classList.contains('matched')) return;

    if (card.dataset.side === 'left') {
        if (selectedLeft) selectedLeft.classList.remove('selected');
        selectedLeft = card;
        card.classList.add('selected');
    } else {
        if (!selectedLeft) {
            animateError(card);
            return;
        }

        if (selectedLeft.dataset.id === card.dataset.id) {
            drawConnection(selectedLeft, card);
            selectedLeft.classList.remove('selected');
            selectedLeft.classList.add('matched');
            card.classList.add('matched');
            selectedLeft = null;
            matchedCount++;
            if (matchedCount === 6) setTimeout(() => document.getElementById('win-msg').style.display = 'block', 500);
        } else {
            animateError(card);
            animateError(selectedLeft);
            selectedLeft.classList.remove('selected');
            selectedLeft = null;
        }
    }
}

function animateError(el) {
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 400);
}

function drawConnection(el1, el2) {
    const svg = document.getElementById('svg-canvas');
    const rect1 = el1.getBoundingClientRect();
    const rect2 = el2.getBoundingClientRect();
    const container = document.getElementById('game').getBoundingClientRect();

    const line = document.createElementNS("http://www.w3.org", "line");
    
    // Вычисляем координаты относительно контейнера игры
    line.setAttribute("x1", rect1.right - container.left);
    line.setAttribute("y1", (rect1.top + rect1.height / 2) - container.top);
    line.setAttribute("x2", rect2.left - container.left);
    line.setAttribute("y2", (rect2.top + rect2.height / 2) - container.top);

    svg.appendChild(line);
}

// Перерисовка линий при изменении размера окна (чтобы не "отрывались")
window.onresize = () => {
    document.getElementById('svg-canvas').innerHTML = '';
    matchedCount = 0; // В реальном приложении лучше просто пересчитать координаты уже существующих линий
    location.reload(); 
};

init();
</script>
</body>
</html>
