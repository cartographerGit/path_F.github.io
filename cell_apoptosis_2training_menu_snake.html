<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Quiz Pro</title>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; 
            margin: 0; background: #2c3e50; color: white; font-family: sans-serif; 
            touch-action: none; overflow: hidden; height: 100vh;
        }
        #ui { width: 95%; max-width: 600px; text-align: center; margin-top: 10px; }
        .stats { display: flex; justify-content: space-between; font-size: 1.2rem; margin-bottom: 8px; }
        #q-box { background: #e67e22; padding: 15px; border-radius: 10px; font-weight: bold; font-size: 1.1rem; min-height: 45px; margin-bottom: 10px; box-shadow: 0 4px 0 #d35400; }
        
        /* ГИБКОЕ ПОЛЕ */
        #game-wrapper { position: relative; }
        canvas { 
            background: #34495e; border: 5px solid #ecf0f1; display: block; 
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        /* Настройки для PC (Экран больше 800px) */
        @media (min-width: 800px) {
            canvas { width: 600px; height: 600px; }
            .controls { display: none; } /* Прячем кнопки на PC */
        }

        /* Настройки для ТЕЛЕФОНА */
        @media (max-width: 799px) {
            canvas { width: 90vw; height: 90vw; }
            .controls { display: grid; grid-template-columns: repeat(3, 70px); gap: 10px; margin-top: 15px; }
        }

        .btn { width: 70px; height: 70px; background: rgba(255,255,255,0.15); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; user-select: none; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }
        .up { grid-column: 2; } .left { grid-column: 1; } .down { grid-column: 2; } .right { grid-column: 3; }
        
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; border-radius: 5px; }
        button { padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 10px; border: none; background: #27ae60; color: white; font-weight: bold; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stats"><span>Раунд: <span id="round">1</span>/10</span><span>❤️ <span id="lives">7</span></span></div>
    <div id="q-box">Нажми стрелку или кнопку, чтобы начать!</div>
</div>

<div id="game-wrapper">
    <canvas id="game" width="600" height="600"></canvas>
    <div id="overlay">
        <h1 id="msg">Игра окончена</h1>
        <button onclick="resetGame()">ИГРАТЬ СНОВА</button>
    </div>
</div>

<div class="controls">
    <div class="btn up" id="u">▲</div>
    <div class="btn left" id="l">◀</div>
    <div class="btn down" id="d">▼</div>
    <div class="btn right" id="r">▶</div>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const TILE = 30; // Увеличили размер клетки для 600px поля
    const DIM = 20;  // 20x20 клеток

    let snake, dir, nextDir, lives, round, answers, active;

    const questions = [
        { q: "Внутренний путь", a: ["BAX", "касп-8", "Fas"], c: "BAX" },
        { q: "Внешний путь", a: ["BAK", "касп-9", "Fas"], c: "Fas" },
        { q: "Внутренний путь", a: ["касп.-9", "касп-8", "Fas"], c: "касп-9" },
        { q: "Внутренний путь", a: ["bcl-2", "касп-8", "Fas"], c: "bcl-2" },
        { q: "Внешний путь", a: ["касп-9", "FasL", "BAK"], c: "FasL" },
        { q: "Внешний путь", a: ["касп-8", "касп-9", "bcl-2"], c: "касп-8" },
        { q: "Внешний путь", a: ["цитохр.С", "касп-9", "Fas"], c: "Fas" },
        { q: "Внешний путь", a: ["BAK", "касп.-8", "цитохр.С"], c: "касп-8" },
        { q: "Внутренний путь", a: ["цитохр.С", "касп-8", "FasL"], c: "цитохр.С" },
        { q: "Внутренний путь", a: ["касп-9", "касп-8", "Fas"], c: "касп-9" },
        { q: "Эффекторная каспаза", a: ["9", "8", "3"], c: "3" },
        { q: "Инициаторная каспаза", a: ["9", "7", "3"], c: "9" },
        { q: "Инициаторная каспаза", a: ["8", "7", "3"], c: "8" },    
        { q: "Внутренний путь", a: ["FasL", "bcl-2", "касп-8"], c: "bcl-2" },     
    ];
    
    
    function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    }
    
    function initRound() {
        if (round > 10) return end(true);
        document.getElementById("round").innerText = round;
        document.getElementById("q-box").innerText = questions[round-1].q;
        
        answers = [];
        questions[round-1].a.forEach(text => {
            let pos;
            while(!pos) {
                // Генерируем от 1 до 18 (вместо 0-19), чтобы не касаться границ
                let p = { 
                    x: Math.floor(Math.random() * (DIM - 2)) + 1, 
                    y: Math.floor(Math.random() * (DIM - 2)) + 1 
                };
                
                // Проверка: не наступили ли на змейку или другой ответ
                if (!snake.some(s => s.x === p.x && s.y === p.y) && 
                    !answers.some(a => a.x === p.x && a.y === p.y)) {
                    pos = p;
                }
            }
            answers.push({ ...pos, text, isC: text === questions[round-1].c });
        });
    }

    function resetGame() {
        shuffle(questions); 
        snake = [{x: 10, y: 10}];
        dir = {x: 0, y: 0}; nextDir = {x: 0, y: 0};
        lives = 7; round = 1; active = true;
        document.getElementById("lives").innerText = lives;
        document.getElementById("overlay").style.display = "none";
        initRound();
    }

    function end(win) {
        active = false;
        document.getElementById("overlay").style.display = "flex";
        document.getElementById("msg").innerText = win ? "ПОБЕДА! 🎉" : "ТАКОГО НЕ БЫЛОО 😭";
    }

    function update() {
        if (!active || (nextDir.x === 0 && nextDir.y === 0)) return;
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (head.x < 0 || head.x >= DIM || head.y < 0 || head.y >= DIM || snake.some(s=>s.x===head.x && s.y===head.y)) {
            lives--; document.getElementById("lives").innerText = lives;
            if (lives <= 0) return end(false);
            snake = [{x: 10, y: 10}]; nextDir = {x: 0, y: 0}; return;
        }

        snake.unshift(head);
        let hit = answers.findIndex(a => a.x === head.x && a.y === head.y);

        if (hit !== -1) {
            if (answers[hit].isC) { round++; initRound(); }
            else { 
                lives--; document.getElementById("lives").innerText = lives;
                if (lives <= 0) return end(false);
                snake.pop();
            }
        } else {
            snake.pop();
        }
    }

    function draw() {
        ctx.clearRect(0,0,600,600);
        
        // Сетка
        ctx.strokeStyle = "#3d566e";
        for(let i=0; i<=600; i+=TILE) { 
            ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,600); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(600,i); ctx.stroke();
        }

        // Змейка
        snake.forEach((s, i) => {
            ctx.fillStyle = i === 0 ? "#27ae60" : "#2ecc71";
            ctx.fillRect(s.x*TILE+1, s.y*TILE+1, TILE-2, TILE-2);
        });

        // Ответы (УВЕЛИЧЕННЫЕ)
        ctx.font = "bold 20px Arial"; ctx.textAlign = "center";
        answers.forEach(a => {
            ctx.fillStyle = "#f1c40f"; ctx.fillRect(a.x*TILE+1, a.y*TILE+1, TILE-2, TILE-2);
            // Текст с обводкой для видимости
            ctx.strokeStyle = "black"; ctx.lineWidth = 3;
            ctx.strokeText(a.text, a.x*TILE + TILE/2, a.y*TILE - 8);
            ctx.fillStyle = "white"; ctx.fillText(a.text, a.x*TILE + TILE/2, a.y*TILE - 8);
        });
    }

    const setDir = (x, y) => { if (x !== -dir.x || y !== -dir.y) nextDir = {x, y}; };

    window.addEventListener("keydown", e => {
        if(e.key.includes("Up")) setDir(0,-1); if(e.key.includes("Down")) setDir(0,1);
        if(e.key.includes("Left")) setDir(-1,0); if(e.key.includes("Right")) setDir(1,0);
    });

    const bind = (id, x, y) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); setDir(x,y); });
        el.addEventListener("mousedown", () => setDir(x,y));
    };
    bind("u",0,-1); bind("d",0,1); bind("l",-1,0); bind("r",1,0);

    resetGame();
    // Скорость: 220мс (было 150)
    setInterval(() => { update(); draw(); }, 220);
</script>
</body>
</html>
