<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Medical Zones Quiz</title>
    <style>
        :root {
            --accent: #ff8e73ff; /* Коралловый */
            --correct: #63db93ff; /* Мятный */
            --bg: #0a0a0a;
        }

        body { 
            background: var(--bg); 
            color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            overflow: hidden; 
            touch-action: none; 
        }
        
        /* Сетка на 4 зоны */
        #grid { 
            position: absolute; 
            width: 100vw; 
            height: 100vh; 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            grid-template-rows: 1fr 1fr; 
        }

        .zone { 
            border: 1px solid #1a1a1a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px;
            box-sizing: border-box;
            overflow: hidden;
            transition: background 0.2s;
            cursor: pointer;
        }

        .zone:active { background: rgba(99, 219, 147, 0.1); }

        .zone-label { 
            /* Динамический шрифт: подстраивается под экран */
            font-size: clamp(14px, 3.5vw, 22px); 
            font-weight: bold; 
            color: var(--correct); 
            text-align: center; 
            pointer-events: none; 
            line-height: 1.2;
            word-wrap: break-word;
            hyphens: auto;
            max-width: 100%;
        }

        /* Верхняя панель */
        #ui { 
            position: absolute; 
            top: 0; 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
            z-index: 10; 
            pointer-events: none;
        }
        #progress { 
            font-size: 22px; 
            color: var(--accent); 
            font-weight: bold; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        
        /* Карточка вопроса */
        #question-card { 
            position: absolute; 
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            width: 260px; 
            min-height: 120px; 
            background: #161616; 
            border: 3px solid var(--accent);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
            padding: 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: clamp(18px, 5vw, 26px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.8); 
            z-index: 5; 
            pointer-events: none;
            transition: transform 0.1s, opacity 0.3s, left 0.4s, top 0.4s;
        }

        /* Результаты */
        #result-screen { 
            position: fixed; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: var(--bg); 
            display: none; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            overflow-y: auto; 
            z-index: 100; 
        }
        .error-item { 
            background: #161616; 
            margin: 10px 0; 
            padding: 15px; 
            border-left: 5px solid var(--accent); 
            width: 90%; 
            max-width: 500px; 
            border-radius: 8px; 
        }
        .error-q { color: var(--accent); font-weight: bold; font-size: 18px; margin-bottom: 5px; }

        /* Анимации */
        .shake { animation: shake 0.4s both; border-color: #ff4444 !important; }
        @keyframes shake {
            10%, 90% { transform: translate(-52%, -50%); }
            20%, 80% { transform: translate(-48%, -50%); }
            30%, 50%, 70% { transform: translate(-53%, -50%); }
            40%, 60% { transform: translate(-47%, -50%); }
        }

        button { 
            margin: 20px; 
            padding: 15px 40px; 
            background: var(--correct); 
            border: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 18px; 
            cursor: pointer; 
        }
    </style>
</head>
<body>

    <div id="ui"><div id="progress">Вопрос: 1/12</div></div>

    <div id="grid">
        <div class="zone" onclick="processChoice(0)"><div class="zone-label"></div></div>
        <div class="zone" onclick="processChoice(1)"><div class="zone-label"></div></div>
        <div class="zone" onclick="processChoice(2)"><div class="zone-label"></div></div>
        <div class="zone" onclick="processChoice(3)"><div class="zone-label"></div></div>
    </div>

    <div id="question-card">ЦЕНТР</div>

    <div id="result-screen">
        <h2 style="color: var(--correct)">Тест завершен!</h2>
        <div id="final-stats" style="font-size: 20px; margin-bottom: 20px;"></div>
        <h3 id="error-title">История ошибок:</h3>
        <div id="errors-list"></div>
        <button onclick="location.reload()">Начать заново</button>
    </div>

<script>
// Ваш массив вопросов
const questions = [
    { q: "c. Джейкобс", a: ["47,XYY", "47,YYY", "47,XXY", "47,X"], c: "47,XYY" },
    { q: "c. Клайнфелтера", a: ["47,XYY", "47,YYY", "47,XXY", "47,X"], c: "47,XXY" },
    { q: "c. Патау", a: ["47,XX или XY,+15", "47,XX или XY,+13", "47,XX или XY,+18", "47,XX или XY,+21"], c: "47,XX или XY,+13" },
    { q: "c. Эдвардса", a: ["47,XX или XY,+15", "47,XX или XY,+13", "47,XX или XY,+18", "47,XX или XY,+21"], c: "47,XX или XY,+18" }, 
    { q: "Лимфедема при рождении", a: ["47,XYY", "47,XY,+18", "45,X", "47,X"], c: "45,X" },
    { q: "Птеригиум", a: ["45,XXY", "47,XY,+18", "45,X", "46,XY"], c: "45,X" },
    { q: "Коарктация аорты", a: ["47,XY,+15", "46,X,i(X)(q10)", "47,XX,+15", "47,XXY"], c: "46,X,i(X)(q10)" },
    { q: "Гипопаратиреоз, аплазия тимуса", a: ["с. Вильямса", "с. ДиДжорджи", "c. Патау", "с. Нунан"], c: "с. ДиДжорджи" },
    { q: "Гликогенозы", a: ["б. Гурлер, б. Хантера", "б. Ниманна-Пика, б. Гоше", "б. Гирке, б. кленового сиропа", "б. Помпе, б. МакАрдла"], c: "б. Помпе, б. МакАрдла" },
    { q: "Мукоплисахаридозы", a: ["б. Хантера, б. Гурлер", "б. Ниманна-Пика, б. Гоше", "б. Гирке, б. кленового сиропа", "б. Помпе, б. МакАрдла"], c: "б. Хантера, б. Гурлер" },
    { q: "c. Марфана", a: ["фибриллин", "коллаген I", "коллаген III", "коллаген V"], c: "фибриллин" },
    { q: "osteogenesis imperfecta", a: ["коллаген I,II", "коллаген IV,V", "эластин", "коллаген III,V"], c: "коллаген I,II" },
    { q: "с. Элерса-Данло", a: ["коллаген II,V", "коллаген III,V", "коллаген III,IV", "эластин"], c: "коллаген III,V" },
    { q: "c. Альпорта", a: ["фибриллин", "коллаген IV", "коллаген III", "коллаген V"], c: "коллаген IV" },
    { q: "Мышечный гликогеноз, может манифестировать во взрослом возрасте", a: ["б. Помпе", "б. МакАрдла", "б. Гирке", "б. Фабри"], c: "б. МакАрдла" },
    { q: "Пероксисомная болезнь", a: ["X-сцепленная адренолейкодистрофия", "X-сцепленная сидеробластная анемия", "Х-сцепленный лимфопролиферативный синдром", "Х-сцепленная агаммаглобулинемия"], c: "X-сцепленная адренолейкодистрофия" },
    { q: "X-сц. доминантная болезнь", a: ["дефицит Г-6-Ф ДГ", "дефицит аденозиндезаминазы", "дефицит фактора VIII", "дальтонизм"], c: "дефицит Г-6-Ф ДГ" },
    { q: "повтор ЦАГ", a: ["хорея Хантингтона", "с. ломкой Х-хромосомы", "атаксия Фридрейха", "миотоническая дистрофия"], c: "хорея Хантингтона" },
    { q: "самая частная моногенная причина интелектуальной недостаточности у девочек/мальчиков", a: ["с. Ш-Т/с. Дауна", "с. Ретта/с. ломкой Х-хром.", "б. Хантера/дефицит Г-6-Ф ДГ", "с. Ш-Т/с. Клайнфелтера"], c: "с. Ретта/с. ломкой Х-хром." },
    { q: "самая частная причина внезапной сердечной смерти у спортсменов", a: ["гипетрофическая кардиомиопатия", "дилатационная кардиомиопатия", "б. МакАрдла", "миотоническая дистрофия"], c: "гипетрофическая кардиомиопатия" },
    { q: "самая частная трисомия, ведущая к потери беременности", a: ["13", "18", "21", "16"], c: "16" },
    { q: "болезнь с недостатком Cu/ избытком Cu", a: ["б. Фабри/ дефицит Г-6-Ф ДГ", "б. Менкеса/ б. Вильсона-Коновалова", "X-сцепленная адренолейкодистрофия/б. Помпе", "б. Хантера/б. Гурлер"], c: "б. Менкеса/ б. Вильсона-Коновалова" },
    { q: "моногенная болезнь с перегрузкой Fe", a: ["б. Вильсона-Коновалова", "б. Фабри", "первичный гемохроматоз", "б. МакАрдла"], c: "первичный гемохроматоз" },
    { q: "как фенилкутонурия, но не помогает диета без фенилаланина", a: ["дефицит Г-6-Ф ДГ", "дефицит тетрагидробиоптерина", "дефицит аденозиндезаминазы", "алкаптонурия"], c: "дефицит тетрагидробиоптерина" },
    { q: "Врожденная дисфункция коры надпочечников с ▼Н2О, ▼давлением, ▲К", a: ["11β-ОН", "21-ОН", "17-ОН", "22-ОН"], c: "21-ОН" },
    { q: "c. Кона - это фенокопия...", a: ["с. Лиддла", "с. Бартера", "с. Гительмана", "с. Геллера"], c: "с. Лиддла" },
    { q: "Приём петлевых диуретиков - это фенокопия...", a: ["с. Лиддла", "с. Бартера", "с. Гительмана", "с. Геллера"], c: "с. Бартера" },
    { q: "Приём тиазидных диуретиков - это фенокопия...", a: ["с. Лиддла", "с. Бартера", "с. Гительмана", "с. Геллера"], c: "с. Гительмана" },
    { q: "Х-сц. рецессивное", a: ["миодистрофия Дюшенна", "фенилкетонурия", "серповидно-клеточная анемия", "глазно-кожный альбинизм"], c: "миодистрофия Дюшенна" },
    { q: "Х-сц. рецессивное", a: ["с. Марфана", "б. Фабри", "фенилкетонурия", "серповидно-клеточная анемия"], c: "б. Фабри" },
    { q: "Х-сц. иммунодефициты", a: ["б. Брутона, с. ДиДжорджи", "с. Ниймеген, с. Вискотта-Олдрича", "с. Луи-Барр, б. Брутона", "б. Брутона, с. Вискотта-Олдрича"], c: "б. Брутона, с. Вискотта-Олдрича" },
    { q: "Врожденная дисфункция коры надпочечников с вирилизацией", a: ["дефицит StAR", "21-ОН", "17-ОН", "22-ОН"], c: "21-ОН" },
    { q: "Моногенная болезнь с признаками, напоминающими с. Ш-Т", a: ["с. Нунан", "с. Вильямса", "б. МакАрдла", "22-ОН"], c: "с. Нунан" },
    { q: "Самая частая моногеннная причина ХОБЛ", a: ["дефицит α1-антитрипсина", "дефицит аденозиндезаминазы", "дефицит Г-6-Ф ДГ", "дефицит тетрагидробиоптерина"], c: "дефицит α1-антитрипсина" },
];

let state = {
    lvl: 0,
    wrongLog: [],
    currentBatch: [],
    animating: false,
    startX: 0, startY: 0
};

const card = document.getElementById('question-card');

function init() {
    state.currentBatch = [...questions].sort(() => Math.random() - 0.5).slice(0, 12);
    loadLevel();

    document.addEventListener('touchstart', e => {
        state.startX = e.touches[0].clientX;
        state.startY = e.touches[0].clientY;
    });

    document.addEventListener('touchend', e => {
        if (state.animating) return;
        const dx = e.changedTouches[0].clientX - state.startX;
        const dy = e.changedTouches[0].clientY - state.startY;
        if (Math.abs(dx) > 50 || Math.abs(dy) > 50) {
            processChoice(getZoneIndex(e.changedTouches[0].clientX, e.changedTouches[0].clientY));
        }
    });
}

function getZoneIndex(x, y) {
    const w = window.innerWidth / 2;
    const h = window.innerHeight / 2;
    if (x < w) return (y < h) ? 0 : 2;
    return (y < h) ? 1 : 3;
}

function loadLevel() {
    const qData = state.currentBatch[state.lvl];
    document.getElementById('progress').innerText = `Вопрос: ${state.lvl + 1}/12`;
    
    card.style.transition = "none";
    card.innerHTML = qData.q;
    card.style.opacity = '1';
    card.style.left = '50%'; 
    card.style.top = '50%';
    card.style.transform = 'translate(-50%, -50%) scale(1)';

    const zones = document.querySelectorAll('.zone-label');
    const answers = [...qData.a].sort(() => Math.random() - 0.5);
    zones.forEach((z, i) => z.innerHTML = answers[i] || "");
}

function processChoice(idx) {
    if (state.animating) return;
    
    const zones = document.querySelectorAll('.zone-label');
    const chosen = zones[idx].innerHTML;
    const correct = state.currentBatch[state.lvl].c;

    if (chosen === correct) {
        state.animating = true;
        const zoneRect = zones[idx].parentElement.getBoundingClientRect();
        
        card.style.transition = "all 0.4s cubic-bezier(0.5, 0, 0.5, 1)";
        card.style.left = (zoneRect.left + zoneRect.width/2) + 'px';
        card.style.top = (zoneRect.top + zoneRect.height/2) + 'px';
        card.style.transform = "translate(-50%, -50%) scale(0.1)";
        card.style.opacity = "0";

        setTimeout(() => {
            state.lvl++;
            state.animating = false;
            if (state.lvl < 12) loadLevel();
            else showResults();
        }, 450);
    } else {
        state.wrongLog.push({ q: state.currentBatch[state.lvl].q, c: correct, user: chosen });
        card.classList.add('shake');
        setTimeout(() => card.classList.remove('shake'), 400);
    }
}

function showResults() {
    document.getElementById('result-screen').style.display = 'flex';
    document.getElementById('final-stats').innerText = `Всего ошибок: ${state.wrongLog.length}`;
    const list = document.getElementById('errors-list');
    
    const uniqueErrors = Array.from(new Set(state.wrongLog.map(a => a.q)))
        .map(q => state.wrongLog.find(a => a.q === q));

    list.innerHTML = uniqueErrors.length > 0 ? 
        uniqueErrors.map(err => `
            <div class="error-item">
                <div class="error-q">${err.q}</div>
                <div style="font-size:15px; color:#aaa">Нужно было: <span style="color:var(--correct)">${err.c}</span></div>
            </div>
        `).join('') : "<p>Отличная работа!</p>";
}

init();
</script>
</body>
</html>
