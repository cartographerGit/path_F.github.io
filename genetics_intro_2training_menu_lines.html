<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Med Matcher Fixed</title>
    <style>
        :root {
            --accent: #ff8e73ff;
            --correct: #63db93ff;
            --bg: #0a0a0a;
        }
        body { 
            background: var(--bg); color: #fff; 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: 10px; box-sizing: border-box;
            touch-action: manipulation;
        }
        h2 { color: var(--accent); margin: 10px 0; text-align: center; font-size: 1.2rem; }
        
        .game-container {
            display: flex; justify-content: space-between;
            width: 100%; max-width: 600px; position: relative; margin-top: 10px;
        }
        
        .column { display: flex; flex-direction: column; gap: 12px; width: 45%; z-index: 2; }
        
        .card {
            background: #161616; border: 2px solid #333;
            padding: 10px; border-radius: 10px; text-align: center;
            font-weight: bold; cursor: pointer; 
            font-size: 16px; min-height: 60px; 
            display: flex; align-items: center; justify-content: center;
            line-height: 1.2; user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .card.selected { border-color: var(--accent); background: rgba(255, 142, 115, 0.1); }
        .card.matched { border-color: var(--correct); color: var(--correct); opacity: 0.6; }
        
        svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 1;
        }
        line { stroke: var(--correct); stroke-width: 4; stroke-linecap: round; }

        .shake { animation: shake 0.4s; border-color: #ff4444 !important; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        #win-msg { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #161616; padding: 30px; border: 3px solid var(--correct);
            border-radius: 15px; text-align: center; z-index: 100; width: 80%;
        }
        button { background: var(--correct); border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Соедините пары</h2>
    
    <div class="game-container" id="game">
        <svg id="svg-canvas"></svg>
        <div class="column" id="left-col"></div>
        <div class="column" id="right-col"></div>
    </div>

    <div id="win-msg">
        <h2 style="color: var(--correct)">ГОТОВО!</h2>
        <button onclick="location.reload()">Ещё раз</button>
    </div>

<script>
const pairsPool = [
    { l: "Сидеропенический", r: "ЖДА" },
    { l: "Неврологический", r: "В12" },
    { l: "RET ▲", r: "гемолиз" },
    { l: "ОЖСС ▼", r: "АХЗ" },
    { l: "Геморрагический", r: "апластическая" },
    { l: "Сидеробластная", r: "свинец" },
    { l: "Болезнь Минковского-<br>Шоффара", r: "насл. сфероцитоз" },
    { l: "Гиповолемическая<br>нормоцитемия", r: "1 ст." },
    { l: "Нормоволемическая<br>олигоцитемия", r: "2 ст." },
    { l: "Дефект ПФП", r: "дефицит Г6Ф ДГ" },
    { l: "В9 и В12", r: "мегалобластные" },
    { l: "гемоглобинурия", r: "острый канальцевый<br>некроз" },
];

let selectedLeft = null;
let matchedCount = 0;
let connections = []; // Храним пары для перерисовки

function init() {
    const currentPairs = [...pairsPool].sort(() => Math.random() - 0.5).slice(0, 6);
    const leftCol = document.getElementById('left-col');
    const rightCol = document.getElementById('right-col');

    const leftItems = currentPairs.map(p => ({text: p.l, id: p.l})).sort(() => Math.random() - 0.5);
    const rightItems = currentPairs.map(p => ({text: p.r, id: p.l})).sort(() => Math.random() - 0.5);

    leftItems.forEach(item => leftCol.appendChild(createCard(item.text, item.id, 'left')));
    rightItems.forEach(item => rightCol.appendChild(createCard(item.text, item.id, 'right')));
}

function createCard(text, id, side) {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = text;
    div.dataset.id = id;
    div.dataset.side = side;
    div.addEventListener('click', (e) => {
        e.preventDefault();
        handleSelect(div);
    });
    return div;
}

function handleSelect(card) {
    if (card.classList.contains('matched')) return;

    if (card.dataset.side === 'left') {
        if (selectedLeft) selectedLeft.classList.remove('selected');
        selectedLeft = card;
        card.classList.add('selected');
    } else {
        if (!selectedLeft) {
            animateError(card);
            return;
        }

        if (selectedLeft.dataset.id === card.dataset.id) {
            const leftEl = selectedLeft;
            const rightEl = card;
            
            leftEl.classList.remove('selected');
            leftEl.classList.add('matched');
            rightEl.classList.add('matched');
            
            connections.push({ left: leftEl, right: rightEl });
            drawAllConnections();
            
            selectedLeft = null;
            matchedCount++;
            if (matchedCount === 6) setTimeout(() => document.getElementById('win-msg').style.display = 'block', 500);
        } else {
            animateError(card);
            animateError(selectedLeft);
            selectedLeft.classList.remove('selected');
            selectedLeft = null;
        }
    }
}

function animateError(el) {
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 400);
}

function drawAllConnections() {
    const svg = document.getElementById('svg-canvas');
    svg.innerHTML = '';
    const container = document.getElementById('game').getBoundingClientRect();

    connections.forEach(conn => {
        const rectL = conn.left.getBoundingClientRect();
        const rectR = conn.right.getBoundingClientRect();
        const line = document.createElementNS("http://www.w3.org", "line");
        
        line.setAttribute("x1", rectL.right - container.left);
        line.setAttribute("y1", (rectL.top + rectL.height / 2) - container.top);
        line.setAttribute("x2", rectR.left - container.left);
        line.setAttribute("y2", (rectR.top + rectR.height / 2) - container.top);
        svg.appendChild(line);
    });
}

function animateError(el) {
    el.classList.add('shake');
    setTimeout(() => el.classList.remove('shake'), 400);
}

// Перерисовываем без перезагрузки страницы
window.addEventListener('resize', drawAllConnections);

init();
</script>
</body>
</html>
