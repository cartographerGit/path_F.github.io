<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Flash Cards</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f0f2f5; 
            margin: 0; padding: 20px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        .header-content { text-align: center; max-width: 800px; margin-bottom: 30px; }
        .header-content img { width: 100%; max-width: 250px; border-radius: 15px; }

        /* Сетка: 8 на ПК, 4 на мобильных */
        .grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(8, 1fr);
            width: 100%;
            max-width: 1200px;
            grid-auto-flow: dense;
        }

        /* Адаптивность колонок */
        @media (max-width: 1000px) { .grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        /* Маленькая карточка */
        .card {
            perspective: 1000px;
            height: 80px; 
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ГИГАНТСКАЯ карточка при клике */
        .card.is-active {
            grid-column: span 4; /* Занимает 4 колонки из 8 */
            grid-row: span 4;    /* Занимает 4 ряда в высоту */
            height: 350px;       /* Значительно увеличиваем высоту */
            z-index: 100;
        }

        /* На мобильных 4 колонки — это весь экран по ширине */
        @media (max-width: 600px) {
            .card.is-active {
                grid-column: span 4;
                height: 300px;
            }
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.is-active .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 15px;
            box-sizing: border-box;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card-front { 
            background: white; 
            border: 1px solid #ddd; 
            font-size: 0.8rem;
            font-weight: bold;
        }

        .card-back { 
            background: #4A90E2; 
            color: white; 
            transform: rotateY(180deg); 
            font-size: 1.4rem; /* Крупный текст для ответа */
        }

        /* Плавное увеличение текста при активации */
        .card.is-active .card-front { font-size: 1.2rem; }
    </style>
</head>
<body>

    <div class="header-content">
        <img src="https://look.png" alt="Расшифровка карты">
        <h1>Тренажер (Макси-размер)</h1>
        <p>Кликните на карточку, чтобы она раскрылась на пол-экрана.</p>
    </div>

    <div class="grid">
        <!-- Генерируем 16 карточек для наглядности -->
        <script>
            const qa = [
                {q: "HTML", a: "HyperText Markup Language"},
                {q: "CSS", a: "Cascading Style Sheets"},
                {q: "JS", a: "JavaScript Engine"},
                {q: "DOM", a: "Document Object Model"},
                {q: "API", a: "Application Interface"},
                {q: "SQL", a: "Structured Query Language"},
                {q: "URL", a: "Uniform Resource Locator"},
                {q: "HTTP", a: "HyperText Transfer Protocol"},
                {q: "JSON", a: "JS Object Notation"},
                {q: "GIT", a: "Version Control System"},
                {q: "V8", a: "Google JS Engine"},
                {q: "NPM", a: "Node Package Manager"},
                {q: "UI", a: "User Interface"},
                {q: "UX", a: "User Experience"},
                {q: "CLI", a: "Command Line Interface"},
                {q: "DRY", a: "Don't Repeat Yourself"}
            ];

            qa.forEach(item => {
                document.write(`
                    <div class="card" onclick="toggleCard(this)">
                        <div class="card-inner">
                            <div class="card-front">${item.q}</div>
                            <div class="card-back">${item.a}</div>
                        </div>
                    </div>
                `);
            });

            function toggleCard(card) {
                // Закрываем другие карточки, если кликаем на новую
                document.querySelectorAll('.card').forEach(c => {
                    if (c !== card) c.classList.remove('is-active');
                });
                card.classList.toggle('is-active');
            }
        </script>
    </div>

</body>
</html>
