<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Image Flash Cards</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #f0f2f5; 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
        }

        /* КАРТИНКА ПОЛНОСТЬЮ */
        .hero-image {
            width: 100%;       /* Растягиваем на всю ширину */
            height: auto;      /* Высота подстраивается автоматически, чтобы сохранить пропорции */
            display: block;
            max-height: 500px; /* Опционально: ограничиваем максимальную высоту, чтобы не скроллить вечно */
            background-color: #fff; /* Фон, если картинка прозрачная */
        }

        .header-content { 
            text-align: center; 
            max-width: 900px; 
            padding: 30px 20px; 
        }

        .header-content h1 { font-size: 2.2rem; color: #222; margin: 0; }
        .header-content p { font-size: 1.1rem; color: #666; }

        /* СЕТКА */
        .grid-container {
            width: 100%;
            max-width: 1200px; 
            padding: 20px;
            box-sizing: border-box;
        }

        .grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(8, 1fr);
            grid-auto-flow: dense;
        }

        @media (max-width: 1000px) { .grid { grid-template-columns: repeat(6, 1fr); } }
        @media (max-width: 600px) { .grid { grid-template-columns: repeat(4, 1fr); } }

        /* КАРТОЧКИ */
        .card {
            perspective: 1000px;
            height: 80px; 
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.is-active {
            grid-column: span 4; 
            grid-row: span 4;    
            height: 380px;       
            z-index: 100;
        }

        @media (max-width: 600px) {
            .card.is-active { grid-column: span 4; height: 300px; }
        }

        .card-inner {
            position: relative;
            width: 100%; height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card.is-active .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            border-radius: 10px; padding: 10px; box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card-front { background: white; border: 1px solid #ddd; font-weight: bold; font-size: 0.85rem; }
        .card-back { 
            background: #4A90E2; color: white; 
            transform: rotateY(180deg); font-size: 1.4rem; padding: 25px;
        }
    </style>
</head>
<body>

    <!-- Картинка, которая отображается целиком -->
    <img src="assets/image/аллергия.png" alt="iamge" class="hero-image">

    <div class="header-content">
        <h1>Справочник разработчика</h1>
        <p>Нажмите на карточку, чтобы развернуть ответ на весь экран.</p>
    </div>

    <div class="grid-container">
        <div class="grid" id="cardGrid">
            <!-- Карточки добавятся через JS -->
        </div>
    </div>

    <script>
        const cardsData = [
            {q: "HTML", a: "Язык гипертекстовой разметки"},
            {q: "CSS", a: "Стили оформления"},
            {q: "JS", a: "Логика страниц"},
            {q: "Vue", a: "Прогрессивный фреймворк"},
            {q: "React", a: "UI библиотека"},
            {q: "Node", a: "Серверный JS"},
            {q: "NPM", a: "Менеджер пакетов"},
            {q: "Git", a: "Контроль версий"},
            {q: "SQL", a: "Язык запросов"},
            {q: "NoSQL", a: "Гибкие базы данных"},
            {q: "API", a: "Программный интерфейс"},
            {q: "DOM", a: "Структура документа"},
            {q: "HTTP", a: "Протокол передачи"},
            {q: "JSON", a: "Формат данных"},
            {q: "SASS", a: "Препроцессор CSS"},
            {q: "AJAX", a: "Асинхронные запросы"}
        ];

        const grid = document.getElementById('cardGrid');

        cardsData.forEach(item => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                document.querySelectorAll('.card').forEach(c => {
                    if (c !== card) c.classList.remove('is-active');
                });
                card.classList.toggle('is-active');
            };
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-front">${item.q}</div>
                    <div class="card-back">${item.a}</div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
