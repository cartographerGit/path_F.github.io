<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; padding: 0; font-family: sans-serif; background: #f0f2f5; }
        
        /* Картинка с идеальными пропорциями */
        .hero-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .header-content { text-align: center; padding: 20px; }

        /* Сетка 8 в ряд (ПК), 4 в ряд (Телефон) */
        .grid {
            display: grid;
            gap: 10px;
            padding: 10px;
            grid-template-columns: repeat(8, 1fr);
            grid-auto-flow: dense;
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* Карточка */
        .card {
            perspective: 1000px;
            height: 80px;
            cursor: pointer;
            transition: all 0.5s ease;
        }

        /* Увеличенное состояние */
        .card.is-active {
            grid-column: span 4;
            grid-row: span 4;
            height: 350px;
            z-index: 10;
        }

        .card-inner {
            position: relative;
            width: 100%; height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.is-active .card-inner { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%; height: 100%;
            backface-visibility: hidden;
            display: flex; align-items: center; justify-content: center;
            border-radius: 8px; border: 1px solid #ddd;
            background: white; text-align: center; padding: 5px;
        }

        .card-back { background: #4A90E2; color: white; transform: rotateY(180deg); }
    </style>
</head>
<body>

    <!-- Картинка сохранит свои пропорции автоматически -->
    <img src="assets/image/карта-аллергия.png" alt="Header image" class="hero-image">

    <div class="header-content">
        <h1>IT Справочник</h1>
    </div>

    <div class="grid" id="cardGrid"></div>

    <script>
        const items = ["HTML", "CSS", "JS", "PHP", "SQL", "GIT", "API", "DOM", "JSON", "REST", "WEB", "UI", "UX", "URL", "NPM", "V8"];
        const grid = document.getElementById('cardGrid');

        items.forEach(text => {
            const card = document.createElement('div');
            card.className = 'card';
            card.onclick = () => {
                document.querySelectorAll('.card').forEach(c => { if(c !== card) c.classList.remove('is-active'); });
                card.classList.toggle('is-active');
            };
            card.innerHTML = `<div class="card-inner"><div class="card-front">${text}</div><div class="card-back">Описание для ${text}</div></div>`;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
