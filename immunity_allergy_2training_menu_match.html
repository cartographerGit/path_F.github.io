<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mega Words REM Edition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <style>
        :root {
            /* Базовый размер для расчетов rem */
            font-size: 16px; 
        }

        * {
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Arial Black', sans-serif; 
            background: #000; 
            color: white;
            touch-action: none;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        #game-container { 
            position: relative; 
            width: 100%; 
            height: 100%; 
            background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e); 
        }
        
        /* ИСПОЛЬЗУЕМ REM ДЛЯ МАСШТАБИРУЕМОСТИ */
        .word-item { 
            position: absolute; 
            padding: 1.5rem 2.5rem; /* rem вместо px */
            background: rgba(40, 40, 40, 0.9); 
            border-radius: 5rem; 
            cursor: pointer; 
            font-weight: 900;
            font-size: 2.2rem; /* Огромный текст в rem */
            box-shadow: 0 0.6rem 1.8rem rgba(0,0,0,0.8); 
            border: 0.25rem solid #555;
            transition: transform 0.1s;
            text-transform: uppercase;
            text-align: center;
            white-space: nowrap;
            max-width: 90vw;
        }

        .correct { background: #27ae60 !important; border-color: #2ecc71 !important; transform: scale(1.1); }
        .wrong { background: #c0392b !important; border-color: #e74c3c !important; animation: shake 0.3s; }

        #ui { 
            position: absolute; 
            top: 0; 
            width: 100%; 
            text-align: center; 
            padding: 1rem; 
            z-index: 10; 
            background: rgba(0,0,0,0.85); 
            border-bottom: 0.15rem solid #444; 
        }

        #target-display { 
            font-size: 2.5rem; 
            color: #f1c40f; 
            margin-bottom: 0.3rem; 
            display: block;
        }

        #stats { 
            font-size: 1.2rem; 
            color: #fff; 
            letter-spacing: 0.05rem;
        }

        @keyframes shake {
            0% { transform: translateX(-0.6rem); }
            50% { transform: translateX(0.6rem); }
            100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="ui">
    <span id="target-display">ЗАГРУЗКА...</span>
    <div id="stats">
        РАУНД: <span id="round-num">1</span> | 
        НУЖНО: <b id="needed">0</b> | 
        <span id="lives-display"></span>
    </div>
</div>

<div id="game-container"></div>

<script>
    const rounds = [
        { target: "ФРУКТЫ", right: ["ЯБЛОКО", "БАНАН", "ГРУША"], wrong: ["СТОЛ", "КОТ", "ДОМ"] },
        { target: "ЦВЕТА", right: ["КРАСНЫЙ", "СИНИЙ", "ЗЕЛЕНЫЙ"], wrong: ["ГРОМ", "ХЛЕБ", "ПИЦЦА"] },
        { target: "КОД", right: ["HTML", "JAVA", "CSS"], wrong: ["ЛУНА", "ТРАВА", "МЯЧ"] },
        { target: "ЗВЕРИ", right: ["ТИГР", "СЛОН", "ВОЛК"], wrong: ["ОКНО", "ЧАЙ", "ЛЕС"] }
    ];

    let currentRoundIdx = 0;
    let collectedCount = 0;
    let lives = 7;
    let gameActive = true;
    const container = document.getElementById('game-container');

    function updateUI() {
        const round = rounds[currentRoundIdx];
        document.getElementById('target-display').innerText = round.target;
        document.getElementById('round-num').innerText = currentRoundIdx + 1;
        document.getElementById('needed').innerText = (round.right.length - collectedCount);
        document.getElementById('lives-display').innerHTML = '❤️'.repeat(lives);
    }

    function createFallingWord() {
        if (!gameActive) return;
        
        const round = rounds[currentRoundIdx];
        const el = document.createElement('div');
        el.className = 'word-item';
        
        const isRight = Math.random() > 0.5;
        const wordPool = isRight ? round.right : round.wrong;
        el.innerText = wordPool[Math.floor(Math.random() * wordPool.length)];
        
        container.appendChild(el);

        // Расположение
        const wordWidth = el.offsetWidth;
        const maxX = window.innerWidth - wordWidth;
        el.style.left = Math.max(5, Math.random() * maxX) + 'px';
        el.style.top = '-10rem'; // Начало выше экрана в rem

        let topPos = -160; // В пикселях для плавного шага анимации
        const interval = setInterval(() => {
            if (!gameActive) return clearInterval(interval);
            topPos += 2.5; 
            el.style.top = topPos + 'px';

            if (topPos > window.innerHeight) {
                if (isRight && !el.clicked) loseLife();
                cleanup();
            }
        }, 20);

        el.onclick = (e) => {
            if (!gameActive || el.clicked) return;
            el.clicked = true;

            if (isRight) {
                el.classList.add('correct');
                collectedCount++;
                updateUI();
                if (collectedCount >= round.right.length) setTimeout(nextRound, 600);
                setTimeout(cleanup, 200);
            } else {
                el.classList.add('wrong');
                loseLife();
                setTimeout(cleanup, 400);
            }
        };

        function cleanup() {
            clearInterval(interval);
            if (el.parentNode) container.removeChild(el);
        }
    }

    function loseLife() {
        lives--;
        updateUI();
        if (lives <= 0) {
            gameActive = false;
            alert("такого не былоо 😭");
            location.reload();
        }
    }

    function nextRound() {
        currentRoundIdx++;
        if (currentRoundIdx < rounds.length) {
            startRound();
        } else {
            gameActive = false;
            alert("ПОБЕДА!");
            location.reload();
        }
    }

    function startRound() {
        if (!gameActive) return;
        collectedCount = 0;
        updateUI();
        const spawner = setInterval(() => {
            if (!gameActive || collectedCount >= rounds[currentRoundIdx].right.length) {
                clearInterval(spawner);
                return;
            }
            createFallingWord();
        }, 1500);
    }

    startRound();
</script>
</body>
</html>
