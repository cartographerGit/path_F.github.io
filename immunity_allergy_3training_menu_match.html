<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Big Words Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: #121212; color: white; }
        #game-container { position: relative; width: 100vw; height: 100vh; }
        
        /* УВЕЛИЧЕННЫЕ СЛОВА */
        .word-item { 
            position: absolute; 
            padding: 20px 40px; /* Увеличили внутренние отступы */
            background: #333; 
            border-radius: 50px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 24px; /* Увеличили шрифт */
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); 
            border: 3px solid #555;
            transition: background 0.2s, transform 0.1s;
            white-space: nowrap;
        }

        .correct { background: #2ecc71 !important; border-color: #27ae60 !important; transform: scale(1.1); }
        .wrong { background: #e74c3c !important; border-color: #c0392b !important; animation: shake 0.3s; }

        #ui { position: absolute; top: 0; width: 100%; text-align: center; padding: 20px; z-index: 10; background: rgba(0,0,0,0.5); }
        #target-display { font-size: 45px; color: #f1c40f; text-shadow: 0 0 15px rgba(241,196,15,0.4); margin-bottom: 5px; }
        #stats { font-size: 20px; color: #eee; }
        .life-heart { color: #e74c3c; font-size: 24px; }
        
        @keyframes shake {
            0% { transform: translateX(-8px); } 50% { transform: translateX(8px); } 100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="ui">
    <div id="target-display">Загрузка...</div>
    <div id="stats">
        Раунд: <span id="round-num">1</span> | 
        Осталось собрать: <b id="needed">0</b> | 
        Жизни: <span id="lives-display"></span>
    </div>
</div>

<div id="game-container"></div>

<script>
    const rounds = [
        { target: "ФРУКТЫ", right: ["ЯБЛОКО", "БАНАН", "ГРУША"], wrong: ["такого не  былоо", "можно ещё воопрос", "ДОМ"] },
        { target: "ЦВЕТА", right: ["КРАСНЫЙ", "СИНИЙ", "ЗЕЛЕНЫЙ"], wrong: ["ГРОМ", "ХЛЕБ", "ПИЦЦА"] },
        { target: "КОД", right: ["HTML", "JAVA", "CSS"], wrong: ["ЛУНА", "ТРАВА", "МЯЧ"] },
        { target: "КОСМОС", right: ["МАРС", "ЗВЕЗДА", "РАКЕТА"], wrong: ["НОСКИ", "КНИГА", "ЛОЖКА"] }
    ];

    let currentRoundIdx = 0;
    let collectedCount = 0;
    let lives = 7; // УСТАНОВЛЕНО 7 ЖИЗНЕЙ
    let gameActive = true;
    const container = document.getElementById('game-container');

    function updateUI() {
        const round = rounds[currentRoundIdx];
        document.getElementById('target-display').innerText = round.target;
        document.getElementById('round-num').innerText = currentRoundIdx + 1;
        document.getElementById('needed').innerText = (round.right.length - collectedCount);
        
        // Отображение сердечек
        document.getElementById('lives-display').innerHTML = "❤️".repeat(lives);
    }

    function startRound() {
        if (!gameActive) return;
        collectedCount = 0;
        updateUI();
        
        const spawner = setInterval(() => {
            if (!gameActive || collectedCount >= rounds[currentRoundIdx].right.length) {
                clearInterval(spawner);
                return;
            }
            createFallingWord();
        }, 1100);
    }

    function createFallingWord() {
        const round = rounds[currentRoundIdx];
        const el = document.createElement('div');
        el.className = 'word-item';
        
        const isRight = Math.random() > 0.4; // 60% шанс на правильное слово
        const wordPool = isRight ? round.right : round.wrong;
        el.innerText = wordPool[Math.floor(Math.random() * wordPool.length)];
        
        el.style.left = Math.random() * (window.innerWidth - 200) + 'px';
        el.style.top = '-80px';
        container.appendChild(el);

        let top = -80;
        const interval = setInterval(() => {
            if (!gameActive) return clearInterval(interval);
            top += 2.2; 
            el.style.top = top + 'px';

            if (top > window.innerHeight) {
                // Если пропустили правильное слово — теряем жизнь
                if (isRight && !el.clicked) {
                    loseLife();
                }
                cleanup();
            }
        }, 20);

        el.onclick = () => {
            if (!gameActive || el.clicked) return;
            el.clicked = true;

            if (isRight) {
                el.classList.add('correct');
                collectedCount++;
                updateUI();
                if (collectedCount >= round.right.length) {
                    setTimeout(nextRound, 500);
                }
                setTimeout(cleanup, 200);
            } else {
                el.classList.add('wrong');
                loseLife();
                setTimeout(cleanup, 300);
            }
        };

        function cleanup() {
            clearInterval(interval);
            if (el.parentNode) container.removeChild(el);
        }
    }

    function loseLife() {
        lives--;
        updateUI();
        if (lives <= 0) {
            gameActive = false;
            alert("ИГРА ОКОНЧЕНА! Попробуйте еще раз.");
            location.reload();
        }
    }

    function nextRound() {
        currentRoundIdx++;
        if (currentRoundIdx < rounds.length) {
            alert("Отлично! Переходим к следующему раунду.");
            startRound();
        } else {
            gameActive = false;
            alert("ПОЗДРАВЛЯЕМ! Вы прошли все уровни!");
            location.reload();
        }
    }

    startRound();
</script>
</body>
</html>
