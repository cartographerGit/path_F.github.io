<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Mega Words Game</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Arial Black', sans-serif; background: #000; color: white; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: linear-gradient(to bottom, #1a1a2e, #16213e); }
        
        /* ГИГАНТСКИЕ СЛОВА */
        .word-item { 
            position: absolute; 
            padding: 30px 60px; /* Очень большие отступы */
            background: #222; 
            border-radius: 80px; 
            cursor: pointer; 
            font-weight: 900;
            font-size: 42px; /* Огромный шрифт */
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.1); 
            border: 4px solid #444;
            transition: transform 0.1s;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .correct { background: #27ae60 !important; border-color: #2ecc71 !important; transform: scale(1.1); box-shadow: 0 0 40px #27ae60; }
        .wrong { background: #c0392b !important; border-color: #e74c3c !important; animation: shake 0.3s; box-shadow: 0 0 40px #c0392b; }

        #ui { position: absolute; top: 0; width: 100%; text-align: center; padding: 25px; z-index: 10; background: rgba(0,0,0,0.7); border-bottom: 2px solid #333; }
        #target-display { font-size: 50px; color: #f1c40f; margin-bottom: 10px; letter-spacing: 3px; }
        #stats { font-size: 24px; color: #fff; }
        .heart { color: #ff4757; margin: 0 2px; font-style: normal; }
        
        @keyframes shake {
            0% { transform: translateX(-15px); } 50% { transform: translateX(15px); } 100% { transform: translateX(0); }
        }
    </style>
</head>
<body>

<div id="ui">
    <div id="target-display">ЗАГРУЗКА...</div>
    <div id="stats">
        РАУНД: <span id="round-num">1</span> | 
        НУЖНО: <b id="needed">0</b> | 
        ЖИЗНИ: <span id="lives-display"></span>
    </div>
</div>

<div id="game-container"></div>

<script>
    const rounds = [
        { target: "ФРУКТЫ", right: ["ЯБЛОКО", "БАНАН", "ГРУША"], wrong: ["СТОЛ", "КОТ", "ДОМ"] },
        { target: "ЦВЕТА", right: ["КРАСНЫЙ", "СИНИЙ", "ЗЕЛЕНЫЙ"], wrong: ["ГРОМ", "ХЛЕБ", "ПИЦЦА"] },
        { target: "КОД", right: ["HTML", "JAVA", "CSS"], wrong: ["ЛУНА", "ТРАВА", "МЯЧ"] },
        { target: "ЖИВОТНЫЕ", right: ["ТИГР", "СЛОН", "ВОЛК"], wrong: ["ОКНО", "ЧАЙ", "ЛЕС"] }
    ];

    let currentRoundIdx = 0;
    let collectedCount = 0;
    let lives = 7;
    let gameActive = true;
    const container = document.getElementById('game-container');

    function updateUI() {
        const round = rounds[currentRoundIdx];
        document.getElementById('target-display').innerText = round.target;
        document.getElementById('round-num').innerText = currentRoundIdx + 1;
        document.getElementById('needed').innerText = (round.right.length - collectedCount);
        document.getElementById('lives-display').innerHTML = '<i class="heart">❤️</i>'.repeat(lives);
    }

    function startRound() {
        if (!gameActive) return;
        collectedCount = 0;
        updateUI();
        
        const spawner = setInterval(() => {
            if (!gameActive || collectedCount >= rounds[currentRoundIdx].right.length) {
                clearInterval(spawner);
                return;
            }
            createFallingWord();
        }, 1300); // Чуть увеличил паузу между словами из-за их размера
    }

    function createFallingWord() {
        const round = rounds[currentRoundIdx];
        const el = document.createElement('div');
        el.className = 'word-item';
        
        const isRight = Math.random() > 0.5;
        const wordPool = isRight ? round.right : round.wrong;
        el.innerText = wordPool[Math.floor(Math.random() * wordPool.length)];
        
        // Ограничиваем появление по краям, чтобы огромные слова не вылезали за экран
        const margin = 250;
        el.style.left = (margin / 2) + Math.random() * (window.innerWidth - margin) + 'px';
        el.style.top = '-150px';
        container.appendChild(el);

        let top = -150;
        const interval = setInterval(() => {
            if (!gameActive) return clearInterval(interval);
            top += 2.0; // Комфортная скорость для больших элементов
            el.style.top = top + 'px';

            if (top > window.innerHeight) {
                if (isRight && !el.clicked) loseLife();
                cleanup();
            }
        }, 20);

        el.onclick = () => {
            if (!gameActive || el.clicked) return;
            el.clicked = true;

            if (isRight) {
                el.classList.add('correct');
                collectedCount++;
                updateUI();
                if (collectedCount >= round.right.length) setTimeout(nextRound, 600);
                setTimeout(cleanup, 250);
            } else {
                el.classList.add('wrong');
                loseLife();
                setTimeout(cleanup, 400);
            }
        };

        function cleanup() {
            clearInterval(interval);
            if (el.parentNode) container.removeChild(el);
        }
    }

    function loseLife() {
        lives--;
        updateUI();
        if (lives <= 0) {
            gameActive = false;
            alert("ИГРА ОКОНЧЕНА!");
            location.reload();
        }
    }

    function nextRound() {
        currentRoundIdx++;
        if (currentRoundIdx < rounds.length) {
            alert("РАУНД ЗАВЕРШЕН!");
            startRound();
        } else {
            gameActive = false;
            alert("ВЫ ПРОШЛИ ВСЕ РАУНДЫ! ПОЗДРАВЛЯЕМ!");
            location.reload();
        }
    }

    startRound();
</script>
</body>
</html>
