<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Quiz Fixed</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; margin: 0; background: #2c3e50; color: white; font-family: sans-serif; touch-action: none; overflow: hidden; }
        #ui { width: 95%; max-width: 400px; text-align: center; margin-top: 5px; }
        .stats { display: flex; justify-content: space-between; font-size: 1.1rem; margin-bottom: 5px; }
        #q-box { background: #e67e22; padding: 10px; border-radius: 8px; font-weight: bold; min-height: 40px; margin-bottom: 5px; }
        canvas { background: #34495e; border: 4px solid #ecf0f1; display: block; }
        .controls { display: grid; grid-template-columns: repeat(3, 65px); gap: 10px; margin-top: 10px; }
        .btn { width: 65px; height: 65px; background: rgba(255,255,255,0.2); border: 2px solid white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; user-select: none; }
        .btn:active { background: rgba(255,255,255,0.5); }
        .up { grid-column: 2; } .left { grid-column: 1; } .down { grid-column: 2; } .right { grid-column: 3; }
        #overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
    </style>
</head>
<body>

<div id="ui">
    <div class="stats"><span>Раунд: <span id="round">1</span>/10</span><span>❤️ <span id="lives">7</span></span></div>
    <div id="q-box">Нажмите стрелку, чтобы начать!</div>
</div>

<div style="position: relative;">
    <canvas id="game" width="400" height="400"></canvas>
    <div id="overlay">
        <h1 id="msg">Игра окончена</h1>
        <button onclick="resetGame()" style="padding:15px 30px; font-size:1.2rem; border-radius:10px; border:none; background:#27ae60; color:white;">ИГРАТЬ СНОВА</button>
    </div>
</div>

<div class="controls">
    <div class="btn up" id="u">▲</div>
    <div class="btn left" id="l">◀</div>
    <div class="btn down" id="d">▼</div>
    <div class="btn right" id="r">▶</div>
</div>

<script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const TILE = 20;
    const DIM = 20; // 20x20 клеток

    let snake, dir, nextDir, lives, round, answers, active;

    const questions = [
        { q: "5 + 7 = ?", a: ["11", "12", "13"], c: "12" },
        { q: "Спутник Земли?", a: ["Марс", "Луна", "Венера"], c: "Луна" },
        { q: "Цвет огурца?", a: ["Зеленый", "Синий", "Желтый"], c: "Зеленый" },
        { q: "2 x 3 = ?", a: ["5", "6", "8"], c: "6" },
        { q: "Столица РФ?", a: ["Омск", "Сочи", "Москва"], c: "Москва" },
        { q: "Ледяной дом эскимосов?", a: ["Иглу", "Юрта", "Вигвам"], c: "Иглу" },
        { q: "Сколько ног у мухи?", a: ["4", "6", "8"], c: "6" },
        { q: "Химический символ золота?", a: ["Ag", "Fe", "Au"], c: "Au" },
        { q: "Самая высокая гора?", a: ["Эверест", "Эльбрус", "Килимндж."], c: "Эверест" },
        { q: "Сколько бит в байте?", a: ["10", "8", "16"], c: "8" }
    ];

    function initRound() {
        if (round > 10) return end(true);
        document.getElementById("round").innerText = round;
        document.getElementById("q-box").innerText = questions[round-1].q;
        
        answers = [];
        questions[round-1].a.forEach(text => {
            let pos;
            while(!pos) {
                let p = { x: Math.floor(Math.random()*DIM), y: Math.floor(Math.random()*DIM) };
                if (!snake.some(s=>s.x===p.x && s.y===p.y) && !answers.some(a=>a.x===p.x && a.y===p.y)) pos = p;
            }
            answers.push({ ...pos, text, isC: text === questions[round-1].c });
        });
    }

    function resetGame() {
        snake = [{x: 10, y: 10}];
        dir = {x: 0, y: 0}; nextDir = {x: 0, y: 0};
        lives = 7; round = 1; active = true;
        document.getElementById("lives").innerText = lives;
        document.getElementById("overlay").style.display = "none";
        initRound();
    }

    function end(win) {
        active = false;
        document.getElementById("overlay").style.display = "flex";
        document.getElementById("msg").innerText = win ? "ПОБЕДА! 🎉" : "ПОТРАЧЕНО 💀";
    }

    function update() {
        if (!active || (nextDir.x === 0 && nextDir.y === 0)) return;

        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        // Стены или хвост
        if (head.x < 0 || head.x >= DIM || head.y < 0 || head.y >= DIM || snake.some(s=>s.x===head.x && s.y===head.y)) {
            lives--; document.getElementById("lives").innerText = lives;
            if (lives <= 0) return end(false);
            snake = [{x: 10, y: 10}]; nextDir = {x: 0, y: 0}; return;
        }

        snake.unshift(head);
        let hit = answers.findIndex(a => a.x === head.x && a.y === head.y);

        if (hit !== -1) {
            if (answers[hit].isC) { round++; initRound(); }
            else { 
                lives--; document.getElementById("lives").innerText = lives;
                if (lives <= 0) return end(false);
                snake.pop(); // Не растет при ошибке
            }
        } else {
            snake.pop();
        }
    }

    function draw() {
        ctx.clearRect(0,0,400,400);
        // Сетка для красоты
        ctx.strokeStyle = "#3d566e";
        for(let i=0; i<400; i+=TILE) { ctx.strokeRect(i,0,0,400); ctx.strokeRect(0,i,400,0); }

        // Змейка
        ctx.fillStyle = "#2ecc71";
        snake.forEach((s, i) => {
            ctx.fillStyle = i === 0 ? "#27ae60" : "#2ecc71";
            ctx.fillRect(s.x*TILE, s.y*TILE, TILE-2, TILE-2);
        });

        // Ответы
        ctx.font = "bold 14px Arial"; ctx.textAlign = "center";
        answers.forEach(a => {
            ctx.fillStyle = "#f1c40f"; ctx.fillRect(a.x*TILE, a.y*TILE, TILE-2, TILE-2);
            ctx.fillStyle = "white"; ctx.fillText(a.text, a.x*TILE + TILE/2, a.y*TILE - 5);
        });
        requestAnimationFrame(() => {});
    }

    const setDir = (x, y) => { 
        if (x !== -dir.x || y !== -dir.y) nextDir = {x, y}; 
    };

    // Слушатели
    window.addEventListener("keydown", e => {
        if(e.key==="ArrowUp") setDir(0,-1); if(e.key==="ArrowDown") setDir(0,1);
        if(e.key==="ArrowLeft") setDir(-1,0); if(e.key==="ArrowRight") setDir(1,0);
    });

    const bind = (id, x, y) => {
        const el = document.getElementById(id);
        el.addEventListener("touchstart", (e) => { e.preventDefault(); setDir(x,y); });
        el.addEventListener("mousedown", () => setDir(x,y));
    };
    bind("u",0,-1); bind("d",0,1); bind("l",-1,0); bind("r",1,0);

    resetGame();
    setInterval(() => { update(); draw(); }, 150);
</script>
</body>
</html>
